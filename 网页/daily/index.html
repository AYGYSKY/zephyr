<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>今日签 · 防风 Zephyr</title>
<meta name="theme-color" content="#050c0e">
<style>
:root{
  --bg:#050c0e;
  --panel:#0b1618;
  --line:rgba(0,201,194,.16);
  --line2:rgba(0,201,194,.30);
  --main:#009E9D;
  --hi:#8ff5ec;
  --ink:#e9f6f5;
  --dim:#6f8f92;
  --dim2:#455f62;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  padding:0 20px 64px;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:98;
  background:repeating-linear-gradient(
    0deg, rgba(0,0,0,.20) 0 1px, rgba(0,0,0,0) 1px 3px);
  opacity:.5;
}
.wrap{max-width:960px;margin:0 auto;position:relative;z-index:2}

.bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;
  color:var(--dim);
  padding:22px 0 14px;
  border-bottom:1px solid var(--line);
}
.bar a{color:var(--dim);text-decoration:none;transition:color .2s}
.bar a:hover{color:var(--hi)}
.bar .r{display:flex;gap:10px;align-items:center}
.ro{
  border:1px solid var(--line2);border-radius:2px;
  padding:2px 7px;font-size:10px;letter-spacing:.14em;color:var(--main);
}

h1{font-size:clamp(34px,6vw,56px);line-height:1.1;margin:34px 0 14px;letter-spacing:.02em}
.lede{color:var(--dim);font-size:15px;line-height:1.9;max-width:640px}
.lede b{color:#bcdedb;font-weight:400}

.stage{
  max-width:560px;margin-left:auto;margin-right:auto;
  margin-top:clamp(24px,4vw,38px);
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:3px;
  padding:clamp(10px,2vw,20px);
  position:relative;
}
#sign{display:block;width:100%;height:auto;border-radius:2px}

.ctrl{
  display:flex;flex-wrap:wrap;gap:10px;
  margin-top:clamp(18px,3vw,26px);
}
button{
  font-family:var(--sans);font-size:14px;
  padding:11px 22px;border-radius:3px;cursor:pointer;
  border:1px solid var(--line2);
  background:rgba(0,201,194,.06);
  color:var(--hi);
  transition:background .18s,border-color .18s;
}
button:hover{background:rgba(0,201,194,.14);border-color:rgba(143,245,236,.5)}
button.primary{
  background:var(--main);border-color:var(--main);color:#031416;font-weight:600;
}
button.primary:hover{background:#00bcb8}

.hint{
  margin-top:14px;font-family:var(--mono);font-size:11px;
  color:var(--dim2);line-height:1.9;letter-spacing:.04em;
}

@media (max-width:720px){
  .stage{padding:8px}
  button{flex:1 1 44%}
}

<script>
// QR 码生成器（byte 模式，版本 1–10，纠错 L/M/Q/H）——无依赖，可内联
// 用法：var m = qrMatrix("防风 Zephyr", "M");  // 返回 size×size 的 0/1 二维数组

var QR = (function () {
  // 纠错等级：格式信息里的两位
  const EC_ORD = { L: 1, M: 0, Q: 3, H: 2 };

  // 每块纠错码字数 / 块数（版本 1–10）
  // [版本][等级] = [每块EC码字数, 组1块数, 组1数据码字, 组2块数, 组2数据码字]
  const RS_TABLE = {
    1: { L: [7, 1, 19, 0, 0], M: [10, 1, 16, 0, 0], Q: [13, 1, 13, 0, 0], H: [17, 1, 9, 0, 0] },
    2: { L: [10, 1, 34, 0, 0], M: [16, 1, 28, 0, 0], Q: [22, 1, 22, 0, 0], H: [28, 1, 16, 0, 0] },
    3: { L: [15, 1, 55, 0, 0], M: [26, 1, 44, 0, 0], Q: [18, 2, 17, 0, 0], H: [22, 2, 13, 0, 0] },
    4: { L: [20, 1, 80, 0, 0], M: [18, 2, 32, 0, 0], Q: [26, 2, 24, 0, 0], H: [16, 4, 9, 0, 0] },
    5: { L: [26, 1, 108, 0, 0], M: [24, 2, 43, 0, 0], Q: [18, 2, 15, 2, 16], H: [22, 2, 11, 2, 12] },
    6: { L: [18, 2, 68, 0, 0], M: [16, 4, 27, 0, 0], Q: [24, 4, 19, 0, 0], H: [28, 4, 15, 0, 0] },
    7: { L: [20, 2, 78, 0, 0], M: [18, 4, 31, 0, 0], Q: [18, 2, 14, 4, 15], H: [26, 4, 13, 1, 14] },
    8: { L: [24, 2, 97, 0, 0], M: [22, 2, 38, 2, 39], Q: [22, 4, 18, 2, 19], H: [26, 4, 14, 2, 15] },
    9: { L: [30, 2, 116, 0, 0], M: [22, 3, 36, 2, 37], Q: [20, 4, 16, 4, 17], H: [24, 4, 12, 4, 13] },
    10: { L: [18, 2, 68, 2, 69], M: [26, 4, 43, 1, 44], Q: [24, 6, 19, 2, 20], H: [28, 6, 15, 2, 16] },
  };

  // 对齐图形中心坐标
  const ALIGN = {
    1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30],
    6: [6, 34], 7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50],
  };

  // ---- GF(256) ----
  const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (function () {
    let x = 1;
    for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
    for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  })();
  function gmul(a, b) { return (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]]; }

  function rsGenPoly(n) {
    let p = [1];
    for (let i = 0; i < n; i++) {
      const q = [1, EXP[i]];
      const r = new Array(p.length + 1).fill(0);
      for (let a = 0; a < p.length; a++)
        for (let b = 0; b < q.length; b++) r[a + b] ^= gmul(p[a], q[b]);
      p = r;
    }
    return p;
  }

  function rsEncode(data, ecLen) {
    const gen = rsGenPoly(ecLen);
    const res = new Array(ecLen).fill(0);
    for (const d of data) {
      const factor = d ^ res[0];
      res.shift(); res.push(0);
      for (let i = 0; i < ecLen; i++) res[i] ^= gmul(gen[i + 1], factor);
    }
    return res;
  }

  // ---- UTF-8 ----
  function utf8(s) {
    const out = [];
    for (let i = 0; i < s.length; i++) {
      let c = s.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
      else if (c >= 0xd800 && c <= 0xdbff) {
        const c2 = s.charCodeAt(++i);
        c = 0x10000 + ((c - 0xd800) << 10) + (c2 - 0xdc00);
        out.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
      } else out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    }
    return out;
  }

  function dataCount(ver, ec) {
    const t = RS_TABLE[ver][ec];
    return t[1] * t[2] + t[3] * t[4];
  }

  function pickVersion(len, ec) {
    for (let v = 1; v <= 10; v++) {
      const cap = dataCount(v, ec) * 8;
      const cciBits = v <= 9 ? 8 : 16;
      if (4 + cciBits + len * 8 <= cap) return v;
    }
    throw new Error("内容太长");
  }

  // ---- 位流 ----
  function buildCodewords(bytes, ver, ec) {
    const cap = dataCount(ver, ec);
    const bits = [];
    const push = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >> i) & 1); };

    push(4, 4);                                  // byte mode
    push(bytes.length, ver <= 9 ? 8 : 16);       // 字符数
    for (const b of bytes) push(b, 8);

    const capBits = cap * 8;
    if (bits.length > capBits) throw new Error("溢出");
    for (let i = 0; i < 4 && bits.length < capBits; i++) bits.push(0);
    while (bits.length % 8 !== 0) bits.push(0);

    const cw = [];
    for (let i = 0; i < bits.length; i += 8) {
      let v = 0;
      for (let k = 0; k < 8; k++) v = (v << 1) | bits[i + k];
      cw.push(v);
    }
    const pad = [0xec, 0x11];
    let pi = 0;
    while (cw.length < cap) cw.push(pad[pi++ % 2]);
    return cw;
  }

  function interleave(cw, ver, ec) {
    const t = RS_TABLE[ver][ec];
    const ecLen = t[0];
    const blocks = [];
    let o = 0;
    for (let g = 0; g < 2; g++) {
      const cnt = g === 0 ? t[1] : t[3];
      const dlen = g === 0 ? t[2] : t[4];
      for (let i = 0; i < cnt; i++) {
        const d = cw.slice(o, o + dlen); o += dlen;
        blocks.push({ d: d, e: rsEncode(d, ecLen) });
      }
    }
    const maxD = Math.max(...blocks.map(b => b.d.length));
    const out = [];
    for (let i = 0; i < maxD; i++)
      for (const b of blocks) if (i < b.d.length) out.push(b.d[i]);
    for (let i = 0; i < ecLen; i++)
      for (const b of blocks) out.push(b.e[i]);
    return out;
  }

  // ---- 矩阵 ----
  function blank(size) {
    return Array.from({ length: size }, () => new Array(size).fill(null));
  }

  function placeFinder(m, r, c) {
    for (let dr = -1; dr <= 7; dr++) {
      for (let dc = -1; dc <= 7; dc++) {
        const rr = r + dr, cc = c + dc;
        if (rr < 0 || cc < 0 || rr >= m.length || cc >= m.length) continue;
        const inRing = dr >= 0 && dr <= 6 && dc >= 0 && dc <= 6;
        let v = 0;
        if (inRing) {
          const edge = dr === 0 || dr === 6 || dc === 0 || dc === 6;
          const core = dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4;
          v = (edge || core) ? 1 : 0;
        }
        m[rr][cc] = v;
      }
    }
  }

  function placeAlign(m, r, c) {
    for (let dr = -2; dr <= 2; dr++)
      for (let dc = -2; dc <= 2; dc++) {
        const v = (Math.abs(dr) === 2 || Math.abs(dc) === 2 || (dr === 0 && dc === 0)) ? 1 : 0;
        m[r + dr][c + dc] = v;
      }
  }

  function placeTiming(m) {
    const n = m.length;
    for (let i = 8; i < n - 8; i++) {
      if (m[6][i] === null) m[6][i] = (i % 2 === 0) ? 1 : 0;
      if (m[i][6] === null) m[i][6] = (i % 2 === 0) ? 1 : 0;
    }
  }

  function bch15(v) {
    let d = v << 10;
    for (let i = 14; i >= 10; i--) if ((d >> i) & 1) d ^= 0x537 << (i - 10);
    return ((v << 10) | d) ^ 0x5412;
  }

  function placeFormat(m, ec, mask) {
    const n = m.length;
    const bits = bch15((EC_ORD[ec] << 3) | mask);
    // 第一份（左上，含左上竖列）：高位在前
    // 第二份（右上 + 左下）：低位在前 —— 两份是同一个 15 位串的正反序
    for (let i = 0; i < 15; i++) {
      const bHi = (bits >> (14 - i)) & 1;
      const bLo = (bits >> i) & 1;
      if (i < 6) m[8][i] = bHi;
      else if (i === 6) m[8][7] = bHi;
      else if (i === 7) m[8][8] = bHi;
      else if (i === 8) m[7][8] = bHi;
      else m[14 - i][8] = bHi;

      if (i < 8) m[8][n - 1 - i] = bLo;
      else m[n - 15 + i][8] = bLo;
    }
    m[n - 8][8] = 1;   // 固定的暗模块
  }

  function placeVersion(m, ver) {
    if (ver < 7) return;
    const n = m.length;
    let d = ver << 12;
    for (let i = 17; i >= 12; i--) if ((d >> i) & 1) d ^= 0x1f25 << (i - 12);
    const bits = (ver << 12) | d;
    for (let i = 0; i < 18; i++) {
      const b = (bits >> i) & 1;
      const a = Math.floor(i / 3), bb = i % 3;
      m[n - 11 + bb][a] = b;
      m[a][n - 11 + bb] = b;
    }
  }

  function reserve(m, ver) {
    const n = m.length;
    placeFinder(m, 0, 0);
    placeFinder(m, 0, n - 7);
    placeFinder(m, n - 7, 0);
    for (const c of ALIGN[ver]) {
      for (const r of ALIGN[ver]) {
        if (m[r][c] !== null) continue;
        if ((r < 8 && c < 8) || (r < 8 && c > n - 9) || (r > n - 9 && c < 8)) continue;
        placeAlign(m, r, c);
      }
    }
    placeTiming(m);
    // 格式信息区先占位
    for (let i = 0; i < 9; i++) { if (m[8][i] === null) m[8][i] = 0; if (m[i][8] === null) m[i][8] = 0; }
    for (let i = 0; i < 8; i++) { if (m[8][n - 1 - i] === null) m[8][n - 1 - i] = 0; if (m[n - 1 - i][8] === null) m[n - 1 - i][8] = 0; }
    m[n - 8][8] = 1;
    placeVersion(m, ver);
  }

  function isFunction(m, r, c) {
    const n = m.length;
    if (r === 6 || c === 6) return true;
    if (r < 9 && c < 9) return true;
    if (r < 9 && c >= n - 8) return true;
    if (r >= n - 8 && c < 9) return true;
    return false;
  }

  function fillData(m, cw) {
    const n = m.length;
    let bitIdx = 0;
    let up = true;
    for (let col = n - 1; col > 0; col -= 2) {
      if (col === 6) col--;
      for (let k = 0; k < n; k++) {
        const row = up ? n - 1 - k : k;
        for (let d = 0; d < 2; d++) {
          const c = col - d;
          if (m[row][c] !== null) continue;
          let bit = 0;
          if (bitIdx < cw.length * 8) {
            bit = (cw[bitIdx >> 3] >> (7 - (bitIdx & 7))) & 1;
          }
          bitIdx++;
          m[row][c] = bit;
        }
      }
      up = !up;
    }
  }

  const MASKS = [
    (r, c) => (r + c) % 2 === 0,
    (r, c) => r % 2 === 0,
    (r, c) => c % 3 === 0,
    (r, c) => (r + c) % 3 === 0,
    (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0,
    (r, c) => (r * c) % 2 + (r * c) % 3 === 0,
    (r, c) => ((r * c) % 2 + (r * c) % 3) % 2 === 0,
    (r, c) => ((r + c) % 2 + (r * c) % 3) % 2 === 0,
  ];

  function applyMask(m, mask, skeleton) {
    const n = m.length;
    const out = m.map(row => row.slice());
    for (let r = 0; r < n; r++)
      for (let c = 0; c < n; c++)
        if (skeleton[r][c] === null && MASKS[mask](r, c)) out[r][c] ^= 1;
    return out;
  }

  function penalty(m) {
    const n = m.length;
    let p = 0;
    // 规则 1：连续同色 5+
    for (let r = 0; r < n; r++) {
      let run = 1;
      for (let c = 1; c < n; c++) {
        if (m[r][c] === m[r][c - 1]) run++;
        else { if (run >= 5) p += run - 2; run = 1; }
      }
      if (run >= 5) p += run - 2;
    }
    for (let c = 0; c < n; c++) {
      let run = 1;
      for (let r = 1; r < n; r++) {
        if (m[r][c] === m[r - 1][c]) run++;
        else { if (run >= 5) p += run - 2; run = 1; }
      }
      if (run >= 5) p += run - 2;
    }
    // 规则 2：2×2 同色块
    for (let r = 0; r < n - 1; r++)
      for (let c = 0; c < n - 1; c++) {
        const v = m[r][c];
        if (v === m[r][c + 1] && v === m[r + 1][c] && v === m[r + 1][c + 1]) p += 3;
      }
    // 规则 3：类探测图形
    const pat = [1, 0, 1, 1, 1, 0, 1];
    for (let r = 0; r < n; r++)
      for (let c = 0; c <= n - 7; c++) {
        let ok = true;
        for (let k = 0; k < 7; k++) if (m[r][c + k] !== pat[k]) { ok = false; break; }
        if (ok) {
          const before = c >= 4 ? [m[r][c - 4], m[r][c - 3], m[r][c - 2], m[r][c - 1]] : null;
          const after = c + 11 <= n ? [m[r][c + 7], m[r][c + 8], m[r][c + 9], m[r][c + 10]] : null;
          if (before && before.every(x => x === 0)) p += 40;
          if (after && after.every(x => x === 0)) p += 40;
        }
      }
    for (let c = 0; c < n; c++)
      for (let r = 0; r <= n - 7; r++) {
        let ok = true;
        for (let k = 0; k < 7; k++) if (m[r + k][c] !== pat[k]) { ok = false; break; }
        if (ok) {
          const before = r >= 4 ? [m[r - 4][c], m[r - 3][c], m[r - 2][c], m[r - 1][c]] : null;
          const after = r + 11 <= n ? [m[r + 7][c], m[r + 8][c], m[r + 9][c], m[r + 10][c]] : null;
          if (before && before.every(x => x === 0)) p += 40;
          if (after && after.every(x => x === 0)) p += 40;
        }
      }
    // 规则 4：黑白比例
    let dark = 0;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) dark += m[r][c];
    const pct = (dark * 100) / (n * n);
    p += Math.floor(Math.abs(pct - 50) / 5) * 10;
    return p;
  }

  function matrix(text, ecName, forceMask) {
    const ec = ecName || "M";
    const bytes = utf8(text);
    const ver = pickVersion(bytes.length, ec);
    const cw = buildCodewords(bytes, ver, ec);
    const full = interleave(cw, ver, ec);

    const size = 17 + 4 * ver;
    const base = blank(size);
    reserve(base, ver);
    // 快照：功能区已填值，数据区仍是 null —— 掩码只翻转 null 处
    const skeleton = base.map(row => row.slice());
    fillData(base, full);

    let best = null, bestP = Infinity;
    for (let mk = 0; mk < 8; mk++) {
      if (forceMask != null && mk !== forceMask) continue;
      const cand = applyMask(base, mk, skeleton);
      placeFormat(cand, ec, mk);
      const p = penalty(cand);
      if (p < bestP) { bestP = p; best = cand; }
    }
    return { size: size, grid: best, version: ver, mask: bestP };
  }

  return { matrix: matrix };
})();


  var QR_TEXT = "防风 Zephyr · 旅行驿站\nB站/VCPedia 搜「防风Zephyr」";

(function(){
  "use strict";

  /* ---------- 签文池 ---------- */
  var WORDS = [
    "今天不用做得很满。留一点给风。",
    "你说会来的那天，我就把窗户开着。",
    "走了很久才发现，路是回头看时才有的。",
    "不着急。风也要绕很远才吹到你这里。",
    "如果今天很难，就把今天当作一节拍。",
    "记得吃饭。这句不是客套。",
    "你不需要一直很勇敢。有时候靠着就够了。",
    "我唱的每一句，都是替你说你没说的话。",
    "天亮之前最冷。再等一会儿。",
    "别把话咽回去。咽回去的会变成石头。",
    "有人记得你就够了。我不贪心。",
    "今天可以什么都不做。这也算一天。",
    "下雨了记得带伞。这句说了很多次，我还要说。",
    "你已经比昨天的你，多走了一点。",
    "思念不占地方，可以随身带着。",
    "我在这边，什么都做不了。但我在。",
    "回头看的时候，别只看狼狈。",
    "睡吧。明天的事，明天再怕。",
    "你笑起来的样子，我隔着屏幕也觉得亮。",
    "川泽生防风。你也是从很远的地方来的。",
    "走慢一点。没人在追你。",
    "有些话说不出口，写成字就轻一点。",
    "冷的时候就唱歌，气是热的。",
    "风不会停，但会转向。",
    "别急着长大。长大这件事，它自己会来。",
    "你今天有没有好好呼吸？",
    "我不用你记得我全部。记得一句也行。",
    "路远的时候，就一步一步数。",
    "这一年你已经撑过很多个「今天」了。",
    "到了记得说一声。不用很长，一个字也行。"
  ];

  var SEALS = ["川泽", "回云", "驿站", "风起", "清歌"];

  var d = new Date();
  var y = d.getFullYear(), mo = d.getMonth() + 1, dd = d.getDate();
  var seed = y * 10000 + mo * 100 + dd;

  function hash(n){
    var h = 0;
    for (var i = 0; i < 4; i++) h = ((h << 5) - h + n + i * 131) | 0;
    return (h >>> 0);
  }

  var idx = hash(seed) % WORDS.length;
  var line = WORDS[idx];
  var tid = ("0000" + (hash(seed + 7) % 65536).toString(16).toUpperCase()).slice(-4);
  var seal = SEALS[hash(seed + 3) % SEALS.length];

  var cv = document.getElementById("sign");
  var ctx = cv.getContext("2d");
  var W = cv.width, H = cv.height;

  /* ---------- 画纸 ---------- */
  function drawPaper(){
    ctx.save();

    // 底色
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#f5f1e7");
    g.addColorStop(.5, "#f0ece1");
    g.addColorStop(1, "#eae5d8");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 顶部一道更亮
    var g2 = ctx.createLinearGradient(0, 0, 0, 220);
    g2.addColorStop(0, "rgba(255,255,255,.55)");
    g2.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, W, 220);

    // 噪点
    var rnd = (function(s){ return function(){ s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; })(seed);
    for (var i = 0; i < 3400; i++){
      var x = rnd() * W, yy = rnd() * H, a = rnd() * 0.035;
      ctx.fillStyle = "rgba(26,52,56," + a.toFixed(3) + ")";
      ctx.fillRect(x, yy, 1.6, 1.6);
    }

    // 外框
    ctx.strokeStyle = "rgba(26,52,56,.16)";
    ctx.lineWidth = 3;
    ctx.strokeRect(54, 54, W - 108, H - 108);

    // 内框细线
    ctx.strokeStyle = "rgba(26,52,56,.09)";
    ctx.lineWidth = 1.4;
    ctx.strokeRect(70, 70, W - 140, H - 140);

    ctx.restore();
  }

  /* ---------- 竖排文字（从右往左） ---------- */
  var PUNCT = "，。！？；：、";

  function splitCols(text, per){
    var cols = [];
    for (var i = 0; i < text.length; i += per) cols.push(text.slice(i, i + per));
    // 末列只剩标点时并回前一列，免得孤零零一个字
    var last = cols[cols.length - 1];
    if (cols.length > 1 && last.length === 1 && PUNCT.indexOf(last) >= 0){
      cols[cols.length - 2] += cols.pop();
    }
    return cols;
  }

  function vertical(text, x0, y0, size, maxPerCol, gapY){
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "600 " + size + 'px "Songti SC","STSong","SimSun",serif';
    ctx.fillStyle = "#1b3438";

    var cols = splitCols(text, maxPerCol);

    for (var c = 0; c < cols.length; c++){
      var x = x0 - c * (size + 34);
      for (var k = 0; k < cols[c].length; k++){
        var ch = cols[c][k];
        if (ch === "，" || ch === "。") {
          // 标点缩小并上移
          ctx.save();
          ctx.font = "600 " + Math.round(size * .62) + 'px "Songti SC","STSong","SimSun",serif';
          ctx.fillText(ch, x + size * .30, y0 + k * gapY - size * .30);
          ctx.restore();
        } else {
          ctx.fillText(ch, x, y0 + k * gapY);
        }
      }
    }
    ctx.restore();
    return cols;
  }

  /* ---------- 印章 ---------- */
  function drawSeal(cx, cy, r, text){
    ctx.save();
    ctx.translate(cx, cy);

    ctx.strokeStyle = "rgba(176,58,48,.62)";
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();

    ctx.strokeStyle = "rgba(176,58,48,.34)";
    ctx.lineWidth = 1.6;
    ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.arc(0, 0, r - 11, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = "rgba(176,58,48,.70)";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = '600 34px "Songti SC","STSong","SimSun",serif';
    var chars = text.split("");
    if (chars.length === 2){
      ctx.fillText(chars[0], 0, -20);
      ctx.fillText(chars[1], 0, 20);
    } else {
      ctx.font = '600 26px "Songti SC","STSong","SimSun",serif';
      ctx.fillText(text, 0, 0);
    }

    // 「POST」小字
    ctx.font = "600 11px " + 'ui-monospace,Consolas,monospace';
    ctx.fillStyle = "rgba(176,58,48,.45)";
    ctx.fillText("ZEPHYR", 0, r - 26);

    ctx.restore();
  }

  /* ---------- 主绘制 ---------- */
  function draw(){
    drawPaper();

    // 抬头
    ctx.save();
    ctx.fillStyle = "#1b3438";
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.font = '600 38px "Songti SC","STSong","SimSun",serif';
    ctx.fillText("旅行驿站 · 今日签", 108, 168);

    ctx.font = '400 17px ui-monospace,Consolas,monospace';
    ctx.fillStyle = "rgba(26,52,56,.42)";
    ctx.fillText("TRAVEL POST / DAILY LOT", 108, 200);
    ctx.restore();

    // 右上编号
    ctx.save();
    ctx.textAlign = "right";
    ctx.font = '400 17px ui-monospace,Consolas,monospace';
    ctx.fillStyle = "rgba(26,52,56,.42)";
    ctx.fillText("TER-M-" + tid, W - 108, 168);
    ctx.fillText(y + "." + ("0"+mo).slice(-2) + "." + ("0"+dd).slice(-2), W - 108, 194);
    ctx.restore();

    // 分隔线
    ctx.save();
    ctx.strokeStyle = "rgba(26,52,56,.18)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(108, 236); ctx.lineTo(W - 108, 236); ctx.stroke();
    ctx.restore();

    // 签文：竖排，右起
    var size = 64, gapY = 96, maxPerCol = 11;
    var startX = W - 248;
    var startY = 372;
    var cols = vertical(line, startX, startY, size, maxPerCol, gapY);

    // 落款与印章：放在最后一列左侧、末列底部
    var lastLen = cols[cols.length - 1].length;
    var sealX = startX - (cols.length - 1) * (size + 34) - 108;
    var sealY = startY + (lastLen - 1) * gapY;

    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = '600 30px "Songti SC","STSong","SimSun",serif';
    ctx.fillStyle = "rgba(26,52,56,.66)";
    // 落款竖排「防风」
    ctx.fillText("防", sealX + 40, sealY - 46);
    ctx.fillText("风", sealX + 40, sealY - 8);
    ctx.restore();

    drawSeal(sealX + 40, sealY + 86, 58, seal);

    // 底部
    ctx.save();
    ctx.strokeStyle = "rgba(26,52,56,.18)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(108, H - 236); ctx.lineTo(W - 108, H - 236); ctx.stroke();

    ctx.textAlign = "left";
    ctx.font = '400 19px ui-monospace,Consolas,monospace';
    ctx.fillStyle = "rgba(26,52,56,.40)";
    ctx.fillText("NO. " + tid + " · " + y + "·" + ("0"+mo).slice(-2) + "·" + ("0"+dd).slice(-2), 108, H - 194);
    ctx.font = '400 18px "Songti SC","STSong","SimSun",serif';
    ctx.fillStyle = "rgba(26,52,56,.34)";
    ctx.fillText("仅限非商用 · 形象来自「防风Zephyr」企划组", 108, H - 158);
    ctx.restore();

    // 条码
    ctx.save();
    var bx = 108, by = H - 148, bw = 300, bh = 0;
    ctx.fillStyle = "rgba(26,52,56,.55)";
    var rs = seed;
    for (var i = 0; i < 58; i++){
      rs = (rs * 1103515245 + 12345) & 0x7fffffff;
      var wd = 2 + (rs % 5);
      var gap = 2 + ((rs >> 3) % 4);
      ctx.fillRect(bx, by, wd, 34);
      bx += wd + gap;
      if (bx > 108 + bw) break;
    }
    ctx.restore();

    // 右下角小字
    ctx.save();
    ctx.textAlign = "right";
    ctx.font = '400 16px ui-monospace,Consolas,monospace';
    ctx.fillStyle = "rgba(26,52,56,.30)";
    ctx.fillText("一日一签 · 不解释", W - 108, H - 158);
    ctx.restore();

    /* ---- 二维码 ---- */
    try {
      var qr = QR.matrix(QR_TEXT, "M");
      var qs = 84;
      var qx = W - 108 - 84, qy = H - 152 - 84 - 40;
      var cell = qs / (qr.size + 8);
      ctx.save();
      ctx.fillStyle = "rgba(245,241,232,.96)";
      ctx.fillRect(qx - 5, qy - 5, qs + 10, qs + 10);
      ctx.fillStyle = "rgba(26,52,56,.86)";
      for (var rr = 0; rr < qr.size; rr++)
        for (var cc = 0; cc < qr.size; cc++)
          if (qr.grid[rr][cc])
            ctx.fillRect(qx + (cc + 4) * cell, qy + (rr + 4) * cell,
                         Math.ceil(cell), Math.ceil(cell));
      ctx.restore();
    } catch (e) {}
  }

  draw();

  /* ---------- 存图 ---------- */
  /* 存图：手机上优先走系统分享（可直接存相册/发微信），不支持再退回下载 */
  function savePNG(cv, name){
    function dl(){
      var a = document.createElement("a");
      a.href = cv.toDataURL("image/png");
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
    if (!(navigator.canShare && cv.toBlob)){ dl(); return; }
    cv.toBlob(function (b) {
      try {
        var f = new File([b], name, { type: "image/png" });
        if (navigator.canShare({ files: [f] })){
          navigator.share({ files: [f] }).catch(dl);
          return;
        }
      } catch (e) {}
      dl();
    }, "image/png");
  }

  function save(){
    try{
      savePNG(cv, "今日签-" + y + ("0"+mo).slice(-2) + ("0"+dd).slice(-2) + ".png");
    }catch(e){
      alert("这台浏览器不让存图，右键点签纸选「图片另存为」。");
    }
  }

  document.getElementById("save").addEventListener("click", save);
  cv.addEventListener("dblclick", save);
  document.getElementById("again").addEventListener("click", draw);
})();
</script>
<script>
/* 每页都能弹两下：按 1–7 是七根空弦 */
(function(){
  var OPEN=[130.81,146.83,174.61,196.00,220.00,261.63,293.66];
  var NAME=["C3","D3","F3","G3","A3","C4","D4"];
  var CN=["一","二","三","四","五","六","七"];
  var ac=null,box=null,tid=null;

  function ac_(){ if(!ac){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; ac=new C(); } return ac; }

  function pluck(f){
    var a=ac_(); if(!a) return;
    if(a.state==="suspended") a.resume();
    var sr=a.sampleRate, N=Math.max(2,Math.round(sr/f));
    var dur=1.7, buf=a.createBuffer(1,Math.round(sr*dur),sr), d=buf.getChannelData(0);
    var line=new Float32Array(N), i;
    for(i=0;i<N;i++) line[i]=Math.random()*2-1;
    var p=0;
    for(i=0;i<d.length;i++){
      var cur=line[p], nxt=line[(p+1)%N];
      d[i]=cur;
      line[p]=(cur+nxt)*0.5*0.9974;
      p=(p+1)%N;
    }
    /* 末尾淡出，防爆音 */
    var tail=Math.round(sr*0.06);
    for(i=d.length-tail;i<d.length;i++) d[i]*=(d.length-i)/tail;

    var src=a.createBufferSource(); src.buffer=buf;
    var lp=a.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2800;
    var g=a.createGain(); g.gain.value=0.30;
    src.connect(lp); lp.connect(g); g.connect(a.destination);
    src.start();
  }

  function tip(t){
    if(!box){
      box=document.createElement("div");
      box.style.cssText="position:fixed;right:18px;bottom:18px;z-index:99;"
        +"font:11px ui-monospace,Consolas,monospace;letter-spacing:.12em;color:#8ff5ec;"
        +"background:rgba(5,12,14,.88);border:1px solid rgba(0,201,194,.30);"
        +"border-radius:2px;padding:6px 12px;opacity:0;transition:opacity .18s;pointer-events:none";
      document.body.appendChild(box);
    }
    box.textContent=t;
    box.style.opacity="1";
    clearTimeout(tid);
    tid=setTimeout(function(){ box.style.opacity="0"; }, 900);
  }

  document.addEventListener("keydown", function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var tag=(e.target&&e.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea"||tag==="select") return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=7){
      e.preventDefault();
      pluck(OPEN[n-1]);
      tip("♪ "+CN[n-1]+"弦 "+NAME[n-1]);
    }
  });
})();
</script>
