<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>配文器 · 防风 Zephyr</title>
<style>
:root{
  --bg:#050c0e; --panel:#0a1416; --panel2:#0d1a1c;
  --line:rgba(0,201,194,.16); --line2:rgba(0,201,194,.34);
  --main:#009E9D; --hi:#8ff5ec; --ink:#e9f6f5;
  --dim:#6f8f92; --mono:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;
  --serif:"Songti SC","SimSun",ui-serif,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{
  font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  background:radial-gradient(1100px 560px at 50% 0%,rgba(0,158,157,.10),transparent 62%),var(--bg);
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.20) 0 1px,transparent 1px 3px);
  opacity:.35;
}
.wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:0 24px 72px}
.bar{
  display:flex;align-items:center;gap:10px;
  padding:26px 0 14px;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--dim);
}
.bar .tid{color:var(--main);letter-spacing:.18em}
.bar .sep{opacity:.4}
.bar a{color:var(--dim);text-decoration:none;border-bottom:1px dotted rgba(111,143,146,.5)}
.bar a:hover{color:var(--hi);border-color:var(--hi)}
.bar .badge{margin-left:auto;padding:4px 10px;border:1px solid var(--line2);color:var(--main);font-size:10px;letter-spacing:.2em}
h1{
  font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:.16em;margin:34px 0 14px;
  background:linear-gradient(180deg,#ffffff,#9fe8e2 60%,#4fa9a4);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.lede{font-size:15px;line-height:1.9;color:#b9d8d6;max-width:640px;margin:0 0 6px}
.lede em{color:var(--hi);font-style:normal}
.meta{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:#4f7276;margin:14px 0 0}
footer{
  margin-top:56px;padding-top:20px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10.5px;line-height:2;letter-spacing:.08em;color:#3f5c60;
}
@media (max-width:860px){.wrap{padding:0 16px 56px}}
@media (prefers-reduced-motion:reduce){body::after{display:none}}
.workspace{
  display:grid;grid-template-columns:1fr 340px;gap:22px;
  margin-top:26px;align-items:start;
}

/* 图库 */
.picker{
  border:1px solid var(--line);background:rgba(10,20,22,.55);
  display:flex;flex-direction:column;min-height:0;
}
.picker-head{
  display:flex;align-items:center;gap:12px;
  padding:13px 16px;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:#4f7276;
}
.picker-head b{color:var(--main);font-weight:400}
.picker-head .kbd{margin-left:auto;letter-spacing:.08em}
.gallery{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));
  gap:8px;padding:12px;max-height:540px;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:rgba(0,201,194,.3) transparent;
}
.gallery::-webkit-scrollbar{width:8px}
.gallery::-webkit-scrollbar-thumb{background:rgba(0,201,194,.25);border-radius:4px}
.thumb{
  position:relative;padding:0;border:1px solid transparent;border-radius:3px;
  background:rgba(0,0,0,.25);cursor:pointer;overflow:hidden;
  transition:border-color .16s,transform .16s;
  aspect-ratio:1;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:.86;transition:opacity .16s}
.thumb:hover{border-color:rgba(0,201,194,.4);transform:translateY(-1px)}
.thumb:hover img{opacity:1}
.thumb.on{border-color:var(--hi);box-shadow:0 0 16px rgba(0,201,194,.3)}
.thumb.on img{opacity:1}
.thumb .lb{
  position:absolute;left:0;right:0;bottom:0;
  padding:2px 4px;background:linear-gradient(180deg,transparent,rgba(3,8,10,.9));
  font-size:9.5px;color:#a8c8c6;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* 舞台 */
.stage{
  border:1px solid var(--line);background:rgba(10,20,22,.55);padding:16px;
  position:sticky;top:16px;
}
.canvas-wrap{
  position:relative;background:#0a1416;border:1px solid var(--line);
  aspect-ratio:1;overflow:hidden;
}
.canvas-wrap img{width:100%;height:100%;object-fit:contain;display:block}
.cap{
  position:absolute;left:0;right:0;padding:10px 12px;
  font-family:"Microsoft YaHei","Segoe UI",sans-serif;
  font-size:17px;font-weight:700;line-height:1.35;letter-spacing:.02em;
  color:#fff;text-align:center;
  text-shadow:0 0 4px #000,0 2px 6px rgba(0,0,0,.9),0 0 14px rgba(0,0,0,.7);
  word-break:break-word;
}
.cap.top{top:0}
.cap.bottom{bottom:0}
.cap.off{display:none}

.controls{margin-top:14px;display:flex;flex-direction:column;gap:11px}
.controls .lab{
  display:flex;align-items:center;justify-content:space-between;
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:#4f7276;
}
.controls .lab b{color:var(--main);font-weight:400}
.controls input[type=text]{
  width:100%;background:#081315;color:var(--ink);
  border:1px solid var(--line);border-radius:2px;padding:10px 12px;
  font-size:14px;font-family:inherit;outline:none;
}
.controls input[type=text]:focus{border-color:rgba(0,201,194,.5);box-shadow:0 0 0 3px rgba(0,201,194,.08)}
.controls input::placeholder{color:#3f5c60}
.seg{display:flex;gap:6px}
.seg button{
  flex:1;padding:8px 0;background:rgba(0,201,194,.06);
  border:1px solid var(--line);border-radius:2px;
  color:var(--dim);font-family:inherit;font-size:11.5px;letter-spacing:.1em;
  cursor:pointer;transition:background .16s,color .16s,border-color .16s;
}
.seg button:hover{background:rgba(0,201,194,.14);color:var(--hi)}
.seg button.on{background:rgba(0,201,194,.22);border-color:rgba(0,201,194,.55);color:var(--hi)}
.actions{display:flex;gap:8px;margin-top:2px}
.actions button{
  flex:1;padding:11px 0;border-radius:2px;cursor:pointer;
  font-family:inherit;font-size:12px;letter-spacing:.14em;
  transition:background .16s,border-color .16s;
}
.actions .primary{
  background:rgba(0,201,194,.16);border:1px solid rgba(0,201,194,.5);color:var(--hi);
}
.actions .primary:hover{background:rgba(0,201,194,.28);border-color:rgba(0,201,194,.75)}
.actions .ghost{
  background:transparent;border:1px solid var(--line);color:var(--dim);
}
.actions .ghost:hover{background:rgba(0,201,194,.08);color:var(--hi)}

.hintline{
  margin-top:10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  color:#3f5c60;line-height:1.7;
}

@media (max-width:860px){
  .workspace{grid-template-columns:1fr}
  .stage{position:static}
  .gallery{max-height:260px;grid-template-columns:repeat(auto-fill,minmax(68px,1fr))}
  .canvas-wrap{max-width:340px;margin:0 auto}
}
</style>
<meta name="theme-color" content="#050c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="旅行驿站">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>@media (hover:none){html{-webkit-tap-highlight-color:transparent}*{-webkit-touch-callout:none}input,textarea,select{-webkit-touch-callout:default;user-select:text;-webkit-user-select:text}}</style>
</head>
<body>
<script src="data.js"></script>
<div class="wrap">

  <div class="bar">
    <span class="tid">TER-M</span>
    <span class="sep">/</span>
    <a href="../index.html">← 终端</a>
    <span class="sep">/</span>
    <span>07 · 配文器</span>
    <span class="badge">只读镜像</span>
  </div>

  <h1>配文器</h1>
  <p class="lede">
    五十七张表情，一张一句话。图是现成的，字你自己写——
    <em>有些话她说不出口，但配在图上就成立了</em>。
  </p>
  <p class="meta">本地生成 · 不上传 · 导出为 PNG</p>

  <div class="workspace">

    <div class="picker">
      <div class="picker-head">
        图库 <b id="cnt">57</b> 张
        <span class="kbd">← → 换图</span>
      </div>
      <div class="gallery" id="gal"></div>
    </div>

    <div class="stage">
      <div class="canvas-wrap">
        <img id="pic" alt="">
        <div class="cap top" id="cap"></div>
      </div>

      <div class="controls">
        <div>
          <div class="lab"><span>配文</span><b>0 / 24</b></div>
          <input id="txt" type="text" maxlength="24" placeholder="写一句…">
        </div>

        <div>
          <div class="lab"><span>位置</span></div>
          <div class="seg" id="posseg">
            <button data-p="top" class="on">在上</button>
            <button data-p="bottom">在下</button>
            <button data-p="off">不写</button>
          </div>
        </div>

        <div>
          <div class="lab"><span>字号</span><b id="fsv">17</b></div>
          <div class="seg" id="fsseg">
            <button data-f="14">小</button>
            <button data-f="17" class="on">中</button>
            <button data-f="21">大</button>
          </div>
        </div>

        <div class="actions">
          <button class="primary" id="save">存成图片</button>
          <button class="ghost" id="next">换一张</button>
        </div>

        <div class="hintline">
          PNG · 600 × 600 · 双击图片也能存<br>
          <span id="fhint"></span>
        </div>
      </div>
    </div>

  </div>

  <footer>
    防风 Zephyr · 形象来自「防风Zephyr」企划组 · 允许非商用二次分发<br>
    配文随手写，别拿去商用就行。
  </footer>

</div>

<script>
(function(){
  "use strict";

  var gal = document.getElementById("gal");
  var pic = document.getElementById("pic");
  var cap = document.getElementById("cap");
  var txt = document.getElementById("txt");
  var fsseg = document.getElementById("fsseg");
  var posseg = document.getElementById("posseg");
  var save = document.getElementById("save");
  var next = document.getElementById("next");
  var cnt = document.getElementById("cnt");
  var fhint = document.getElementById("fhint");

  var cur = 0;
  var pos = "top";
  var fs = 17;

  if (typeof STICKERS === "undefined" || !STICKERS.length){
    cnt.textContent = "0";
    fhint.textContent = "没找到 data.js，图片加载失败。";
    return;
  }

  cnt.textContent = String(STICKERS.length);

  // 图库
  STICKERS.forEach(function(it, i){
    var b = document.createElement("button");
    b.className = "thumb" + (i === 0 ? " on" : "");
    b.type = "button";
    b.setAttribute("data-i", i);
    b.title = it.l;
    var im = document.createElement("img");
    im.src = it.d;
    im.alt = it.l;
    im.loading = "lazy";
    var lb = document.createElement("span");
    lb.className = "lb";
    lb.textContent = it.l;
    b.appendChild(im); b.appendChild(lb);
    b.addEventListener("click", function(){ select(i); });
    gal.appendChild(b);
  });

  /* 存图：手机上优先走系统分享（可直接存相册/发微信），不支持再退回下载 */
  function savePNG(cv, name){
    function dl(){
      var a = document.createElement("a");
      a.href = cv.toDataURL("image/png");
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
    if (!(navigator.canShare && cv.toBlob)){ dl(); return; }
    cv.toBlob(function (b) {
      try {
        var f = new File([b], name, { type: "image/png" });
        if (navigator.canShare({ files: [f] })){
          navigator.share({ files: [f] }).catch(dl);
          return;
        }
      } catch (e) {}
      dl();
    }, "image/png");
  }

  function select(i){
    cur = (i + STICKERS.length) % STICKERS.length;
    pic.src = STICKERS[cur].d;
    pic.alt = STICKERS[cur].l;
    var on = gal.querySelector(".thumb.on");
    if (on) on.classList.remove("on");
    var nb = gal.querySelector('.thumb[data-i="' + cur + '"]');
    if (nb){
      nb.classList.add("on");
      if (nb.scrollIntoView) nb.scrollIntoView({ block: "nearest" });
    }
  }

  function paint(){
    var t = txt.value.trim();
    cap.textContent = t;
    cap.className = "cap " + pos;
    cap.style.fontSize = fs + "px";
    cap.style.display = (pos === "off" || !t) ? "none" : "block";
    var lab = document.querySelector(".lab b");
    if (lab) lab.textContent = t.length + " / 24";
  }

  txt.addEventListener("input", paint);
  txt.addEventListener("keydown", function(e){
    if (e.key === "Enter"){ e.preventDefault(); doSave(); }
  });

  fsseg.addEventListener("click", function(e){
    var b = e.target.closest("button");
    if (!b) return;
    fs = parseInt(b.getAttribute("data-f"), 10);
    Array.prototype.forEach.call(fsseg.children, function(x){ x.classList.toggle("on", x === b); });
    document.getElementById("fsv").textContent = String(fs);
    paint();
  });

  posseg.addEventListener("click", function(e){
    var b = e.target.closest("button");
    if (!b) return;
    pos = b.getAttribute("data-p");
    Array.prototype.forEach.call(posseg.children, function(x){ x.classList.toggle("on", x === b); });
    paint();
  });

  next.addEventListener("click", function(){
    select(cur + 1);
  });

  document.addEventListener("keydown", function(e){
    if (e.target === txt) return;
    if (e.key === "ArrowLeft"){ select(cur - 1); e.preventDefault(); }
    if (e.key === "ArrowRight"){ select(cur + 1); e.preventDefault(); }
  });

  // 导出
  function doSave(){
    var S = 600;
    var cv = document.createElement("canvas");
    cv.width = S; cv.height = S;
    var ctx = cv.getContext("2d");

    ctx.fillStyle = "#0a1416";
    ctx.fillRect(0, 0, S, S);

    var img = new Image();
    img.onload = function(){
      // 等比铺满（cover）
      var r = Math.max(S / img.width, S / img.height);
      var w = img.width * r, h = img.height * r;
      ctx.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);

      var text = txt.value.trim();
      if (text && pos !== "off"){
        var size = fs * (S / 300);          // 预览 300 宽 → 导出 600
        var pad = S * 0.055;
        ctx.font = "700 " + size + "px 'Microsoft YaHei','Segoe UI',sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.lineJoin = "round";

        // 自动换行（按字符，中文友好）
        var lines = [], line = "", maxW = S - pad * 2;
        for (var i = 0; i < text.length; i++){
          var t2 = line + text[i];
          if (ctx.measureText(t2).width > maxW && line){ lines.push(line); line = text[i]; }
          else line = t2;
        }
        if (line) lines.push(line);

        var lh = size * 1.32;
        var blockH = lines.length * lh;
        var y0 = (pos === "top") ? pad : (S - pad - blockH);

        lines.forEach(function(ln, idx){
          var y = y0 + idx * lh;
          ctx.lineWidth = size * 0.14;
          ctx.strokeStyle = "rgba(0,0,0,.92)";
          ctx.strokeText(ln, S / 2, y);
          ctx.fillStyle = "#ffffff";
          ctx.fillText(ln, S / 2, y);
        });
      }

      // 右下角签名
      ctx.font = "400 " + Math.round(S * 0.019) + "px ui-monospace,Consolas,monospace";
      ctx.textAlign = "right";
      ctx.textBaseline = "alphabetic";
      ctx.fillStyle = "rgba(0,201,194,.42)";
      ctx.fillText("防风 Zephyr", S - pad * 0.6, S - pad * 0.4);

      try {
        savePNG(cv, "防风-配文-" + STICKERS[cur].n + "-" + STICKERS[cur].l + ".png");
        document.body.removeChild(a);
      } catch (err){
        fhint.textContent = "导出被浏览器拦了。用 python -m http.server 打开本页再试。";
      }
    };
    img.src = STICKERS[cur].d;
  }

  save.addEventListener("click", doSave);
  pic.addEventListener("dblclick", doSave);

  // 初值
  select(0);
  paint();

  var proto = location.protocol;
  fhint.textContent = (proto === "file:")
    ? "当前是 file:// 打开；导出正常，若被拦就用 python -m http.server。"
    : "在 http 下打开，导出无限制。";
})();
</script>
<script>try{localStorage.setItem('zephyr.visit.sticker','1')}catch(e){}</script>
<script>
/* 每页都能弹两下：按 1–7 是七根空弦 */
(function(){
  var OPEN=[130.81,146.83,174.61,196.00,220.00,261.63,293.66];
  var NAME=["C3","D3","F3","G3","A3","C4","D4"];
  var CN=["一","二","三","四","五","六","七"];
  var ac=null,box=null,tid=null;

  function ac_(){ if(!ac){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; ac=new C(); } return ac; }

  function pluck(f){
    var a=ac_(); if(!a) return;
    if(a.state==="suspended") a.resume();
    var sr=a.sampleRate, N=Math.max(2,Math.round(sr/f));
    var dur=1.7, buf=a.createBuffer(1,Math.round(sr*dur),sr), d=buf.getChannelData(0);
    var line=new Float32Array(N), i;
    for(i=0;i<N;i++) line[i]=Math.random()*2-1;
    var p=0;
    for(i=0;i<d.length;i++){
      var cur=line[p], nxt=line[(p+1)%N];
      d[i]=cur;
      line[p]=(cur+nxt)*0.5*0.9974;
      p=(p+1)%N;
    }
    /* 末尾淡出，防爆音 */
    var tail=Math.round(sr*0.06);
    for(i=d.length-tail;i<d.length;i++) d[i]*=(d.length-i)/tail;

    var src=a.createBufferSource(); src.buffer=buf;
    var lp=a.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2800;
    var g=a.createGain(); g.gain.value=0.30;
    src.connect(lp); lp.connect(g); g.connect(a.destination);
    src.start();
  }

  function tip(t){
    if(!box){
      box=document.createElement("div");
      box.style.cssText="position:fixed;right:18px;bottom:18px;z-index:99;"
        +"font:11px ui-monospace,Consolas,monospace;letter-spacing:.12em;color:#8ff5ec;"
        +"background:rgba(5,12,14,.88);border:1px solid rgba(0,201,194,.30);"
        +"border-radius:2px;padding:6px 12px;opacity:0;transition:opacity .18s;pointer-events:none";
      document.body.appendChild(box);
    }
    box.textContent=t;
    box.style.opacity="1";
    clearTimeout(tid);
    tid=setTimeout(function(){ box.style.opacity="0"; }, 900);
  }

  document.addEventListener("keydown", function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var tag=(e.target&&e.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea"||tag==="select") return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=7){
      e.preventDefault();
      pluck(OPEN[n-1]);
      tip("♪ "+CN[n-1]+"弦 "+NAME[n-1]);
    }
  });
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('../sw.js').catch(function(){})})}</script>
