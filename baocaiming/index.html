<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>报菜名 · 随机一道</title>
<style>:root{
  --teal:#00c9c2;
  --teal-deep:#009e9d;
  --mint:#8ff5ec;
  --bg:#050c0e;
  --fg:#e9f6f5;
  --muted:rgba(233,246,245,.42);
  --line:rgba(0,201,194,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;color:var(--fg);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(900px 480px at 50% -14%, #0b3234 0%, transparent 62%),
    radial-gradient(700px 380px at 88% 108%, #06302f 0%, transparent 58%),
    radial-gradient(560px 340px at 6% 96%, #052529 0%, transparent 60%),
    var(--bg);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(0,201,194,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,201,194,.035) 1px, transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(circle at 50% 34%, #000 0%, transparent 72%);
}
.bgfx{
  position:fixed;left:50%;top:50%;width:220vmax;height:220vmax;
  transform:translate(-50%,-50%) rotate(-45deg);
  z-index:0;pointer-events:none;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;gap:3.8em;
  opacity:.07;color:#8ff5ec;
  font-size:clamp(20px,2.6vw,30px);font-weight:700;letter-spacing:.14em;
  mask-image:radial-gradient(circle at 50% 45%, rgba(0,0,0,.3) 0%, rgba(0,0,0,.75) 58%, #000 92%);
}
.bg-row{white-space:nowrap;line-height:1}
.bg-row span{display:inline-block;animation:bgmove 130s linear infinite}
.bg-row.rev span{animation-direction:reverse}
@keyframes bgmove{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.wrap{
  position:relative;z-index:1;
  width:min(640px,100%);margin:0 auto;
  display:flex;flex-direction:column;gap:20px;
}
.card{
  position:relative;
  padding:34px 30px 28px;
  border-radius:26px;
  background:linear-gradient(180deg, rgba(13,28,30,.92), rgba(7,17,19,.88));
  border:1px solid rgba(0,201,194,.17);
  box-shadow:
    0 28px 64px rgba(0,0,0,.52),
    0 2px 0 rgba(255,255,255,.03) inset,
    0 0 0 1px rgba(0,0,0,.35);
  backdrop-filter:blur(16px) saturate(120%);
}
.card::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg, rgba(255,255,255,.045), transparent 38%);
}
.hero{text-align:center;padding:46px 30px 36px;overflow:hidden}
.hero::before{
  content:"";position:absolute;left:0;right:0;top:-40%;height:100%;pointer-events:none;
  background:radial-gradient(60% 60% at 50% 40%, rgba(0,201,194,.20), transparent 70%);
}
.hero>*{position:relative;z-index:1}
.eyebrow{
  margin:0 0 26px;font-size:11px;letter-spacing:.42em;text-indent:.42em;
  color:rgba(143,245,236,.55);font-weight:600;
}
.stage{min-height:2.35em;display:grid;place-items:center;margin-bottom:10px}
#dish{
  margin:0;font-size:clamp(32px,7.2vw,56px);font-weight:800;line-height:1.2;letter-spacing:.01em;
  background:linear-gradient(180deg,#ffffff 8%,#b9fff8 55%,#5fe3da 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 34px rgba(0,201,194,.28));
  transition:transform .18s ease, filter .18s ease;
  word-break:break-word;text-align:center;
}
#dish.rolling{filter:drop-shadow(0 0 44px rgba(0,201,194,.45));transform:scale(.96)}
#dish.hit{animation:pop .55s cubic-bezier(.22,1.4,.36,1)}
@keyframes pop{
  0%{transform:scale(.92);opacity:.5}
  55%{transform:scale(1.05)}
  100%{transform:scale(1);opacity:1}
}
.sub{margin:0 0 30px;font-size:13px;color:var(--muted);letter-spacing:.08em;min-height:1.4em}
button{
  appearance:none;border:0;border-radius:999px;
  padding:16px 52px;font-size:15.5px;font-weight:700;font-family:inherit;letter-spacing:.14em;
  color:#032624;cursor:pointer;
  background:linear-gradient(135deg,#b9fff8,#00cfc7 60%,#00b3ac);
  box-shadow:
    0 16px 36px rgba(0,201,194,.30),
    0 1px 0 rgba(255,255,255,.6) inset,
    0 -2px 6px rgba(0,0,0,.18) inset;
  transition:transform .18s ease, box-shadow .24s ease, opacity .2s ease;
}
button:hover{transform:translateY(-2px);box-shadow:0 22px 46px rgba(0,201,194,.4),0 1px 0 rgba(255,255,255,.6) inset}
button:active{transform:translateY(0) scale(.975)}
button:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
.hint{margin:18px 0 0;font-size:11.5px;color:rgba(233,246,245,.26);letter-spacing:.12em}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.panel-head h2{margin:0;font-size:13.5px;letter-spacing:.26em;color:var(--mint);font-weight:700}
.panel-head .right{display:flex;align-items:center;gap:9px}
.meta{font-size:11.5px;color:var(--muted);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.ghost{
  background:rgba(0,201,194,.04);border:1px solid rgba(0,201,194,.24);
  color:rgba(143,245,236,.72);font-size:11.5px;padding:6px 13px;
  border-radius:999px;box-shadow:none;font-weight:500;letter-spacing:.06em;
}
.ghost:hover{transform:none;box-shadow:none;background:rgba(0,201,194,.12);border-color:rgba(0,201,194,.4)}
.toggle{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(0,201,194,.04);border:1px solid rgba(0,201,194,.24);
  color:rgba(143,245,236,.78);font-size:11.5px;padding:6px 12px;border-radius:999px;
  box-shadow:none;font-weight:500;letter-spacing:.06em;
}
.toggle:hover{background:rgba(0,201,194,.12);transform:none;box-shadow:none;border-color:rgba(0,201,194,.4)}
.toggle .arrow{transition:transform .32s ease;font-size:9px;line-height:1;opacity:.7}
.toggle[aria-expanded="false"] .arrow{transform:rotate(-90deg)}
.fold{
  overflow:hidden;max-height:1500px;opacity:1;
  transition:max-height .4s cubic-bezier(.4,0,.2,1), opacity .28s ease, margin-top .32s ease;
}
.fold.collapsed{max-height:0;opacity:0;margin-top:-16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:9px}
.entry{
  border-radius:13px;padding:10px 10px 8px;min-height:56px;
  background:rgba(255,255,255,.022);
  border:1px solid rgba(255,255,255,.055);
  display:flex;flex-direction:column;justify-content:space-between;gap:6px;
  transition:background .3s, border-color .3s, box-shadow .3s, transform .3s;
}
.entry .nm{font-size:11.5px;line-height:1.32;color:rgba(233,246,245,.22);word-break:break-word}
.entry .ct{font-size:10px;color:rgba(233,246,245,.18);letter-spacing:.04em}
.entry.on{
  background:linear-gradient(155deg, rgba(0,201,194,.20), rgba(0,201,194,.04));
  border:1px solid rgba(0,201,194,.46);
  box-shadow:0 6px 20px rgba(0,201,194,.14), 0 0 0 1px rgba(0,201,194,.08) inset;
}
.entry.on .nm{color:#f2fffe;font-weight:600}
.entry.on .ct{color:rgba(143,245,236,.8)}
.entry.peek{
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:none;
}
.entry.peek .nm{color:rgba(233,246,245,.62);font-weight:500}
.entry.peek .ct{color:rgba(233,246,245,.28)}
.entry.new{animation:flash .9s ease}
@keyframes flash{
  0%{transform:scale(.94);box-shadow:0 0 0 0 rgba(143,245,236,.55)}
  60%{transform:scale(1.03)}
  100%{transform:scale(1);box-shadow:0 0 0 14px rgba(143,245,236,0)}
}
.total-line{margin:0 0 18px;font-size:12.5px;color:rgba(233,246,245,.48);letter-spacing:.06em}
.total-line b{color:var(--mint);font-size:17px;margin:0 4px;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:1fr 1.9fr auto;gap:11px;align-items:center}
.bar .n{font-size:11.5px;color:rgba(233,246,245,.58);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:6px;border-radius:999px;background:rgba(255,255,255,.055);overflow:hidden}
.bar .fill{
  height:100%;border-radius:999px;width:0;
  background:linear-gradient(90deg,var(--teal-deep),var(--mint));
  box-shadow:0 0 10px rgba(0,201,194,.35);
  transition:width .55s cubic-bezier(.22,1,.36,1);
}
.bar .v{font-size:11.5px;color:rgba(143,245,236,.85);min-width:20px;text-align:right;font-variant-numeric:tabular-nums}
.empty{margin:0;font-size:11.5px;color:rgba(233,246,245,.26)}
.ver{margin:6px 0 0;text-align:center;font-size:10.5px;color:rgba(233,246,245,.16);letter-spacing:.16em}
@media (max-width:480px){
  body{padding:20px 14px 44px}
  .card{padding:26px 18px 22px;border-radius:20px}
  .hero{padding:34px 18px 28px}
  button{width:100%}
  .panel-head .right button{width:auto}
  .grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .bar{grid-template-columns:1fr 1.3fr auto}
}
@keyframes cardGlow{
  0%,100%{box-shadow:0 28px 64px rgba(0,0,0,.52),0 2px 0 rgba(255,255,255,.03) inset,0 0 0 1px rgba(0,201,194,.14),0 0 26px rgba(0,201,194,.10)}
  50%{box-shadow:0 28px 64px rgba(0,0,0,.52),0 2px 0 rgba(255,255,255,.03) inset,0 0 0 1px rgba(0,201,194,.30),0 0 44px rgba(0,201,194,.22)}
}
.card{animation:cardGlow 5.5s ease-in-out infinite}
.hero{animation-duration:4.2s}
@keyframes btnPulse{
  0%,100%{box-shadow:0 16px 36px rgba(0,201,194,.30),0 1px 0 rgba(255,255,255,.6) inset,0 0 0 0 rgba(0,201,194,.35)}
  50%{box-shadow:0 20px 44px rgba(0,201,194,.45),0 1px 0 rgba(255,255,255,.6) inset,0 0 0 10px rgba(0,201,194,0)}
}
#pick{animation:btnPulse 3.2s ease-in-out infinite}
#dish.gold{
  background:linear-gradient(180deg,#fffdf2 0%,#ffe9a8 45%,#ffc44d 100%);
  -webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 30px rgba(255,196,77,.55)) drop-shadow(0 0 60px rgba(255,196,77,.25));
  animation:goldPop .7s cubic-bezier(.22,1.4,.36,1);
}
@keyframes goldPop{
  0%{transform:scale(.9);filter:drop-shadow(0 0 0 rgba(255,196,77,0))}
  50%{transform:scale(1.08);filter:drop-shadow(0 0 46px rgba(255,220,120,.9))}
  100%{transform:scale(1);filter:drop-shadow(0 0 30px rgba(255,196,77,.55))}
}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.spark{position:absolute;border-radius:2px;opacity:0;animation:sparkFly .95s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes sparkFly{
  0%{transform:translate(-50%,-50%) rotate(0deg) scale(1);opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(.4);opacity:0}
}
.flash{position:fixed;inset:0;pointer-events:none;z-index:55;background:radial-gradient(circle at 50% 38%,rgba(255,224,130,.38),rgba(255,196,77,.10) 45%,transparent 68%);animation:flashOut .85s ease-out forwards}
@keyframes flashOut{0%{opacity:1}100%{opacity:0}}

.toterm{
  position:fixed;left:18px;top:16px;z-index:50;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:11px;letter-spacing:.16em;text-decoration:none;
  color:rgba(143,245,236,.75);
  padding:6px 11px;border:1px solid rgba(0,201,194,.26);border-radius:2px;
  background:rgba(5,12,14,.72);backdrop-filter:blur(4px);
  transition:color .18s,border-color .18s,background .18s;
}
.toterm:hover{color:#8ff5ec;border-color:rgba(0,201,194,.6);background:rgba(0,158,157,.14)}
@media (max-width:560px){ .toterm{left:12px;top:10px;font-size:10px;padding:5px 9px} }
</style>
<meta name="theme-color" content="#050c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="旅行驿站">

<body>
<a class="toterm" href="../index.html">← 终端</a>
<div id="fx" aria-hidden="true"></div>
<div class="bgfx" id="bgfx" aria-hidden="true"></div>
<div class="wrap">
<section class="card hero">
<p class="eyebrow">旅行驿站 · 每周报菜名</p>
<div class="stage"><h1 id="dish">？</h1></div>
<p class="sub" id="sub">今晚吃谁，交给随机</p>
<button id="pick" type="button">抽一道菜</button>
<p class="hint">点按钮或按空格</p>
</section>
<section class="card">
<div class="panel-head">
<h2>图鉴</h2>
<div class="right">
<span class="meta" id="collect">0 / 0</span>
<button class="ghost" id="peek" type="button">全部点亮</button>
<button class="toggle" id="toggle" type="button" aria-expanded="false">
<span id="toggle-text">展开</span><span class="arrow">▼</span>
</button>
</div>
</div>
<div class="fold collapsed" id="fold">
<div class="grid" id="album"></div>
</div>
</section>
<section class="card">
<div class="panel-head">
<h2>统计</h2>
<div class="right">
<button class="ghost" id="reset" type="button">重置</button>
<button class="toggle" id="toggle-stats" type="button" aria-expanded="false">
<span id="toggle-stats-text">展开</span><span class="arrow">▼</span>
</button>
</div>
</div>
<div class="fold collapsed" id="fold-stats">
<p class="total-line">共抽 <b id="total">0</b> 次</p>
<div class="bars" id="bars"></div>
</div>
</section>
<p class="ver">报菜名 v11 · 2026-11-16</p>
</div>
<script>(function () { 'use strict'; var DISHES = [ '红烧玉石', '糖墩星缘', '清蒸乐子姐姐', '麻辣里昂老师', '蒜蓉尘墨', '香软尘宝', '香辣气球', '爆炒草莓', '糖醋安娜老师', '炖安小弟', '东湖醋一条鱼', '油炸 mike', '比混泥土还硬的终焉', '水煮烤鸭', '煎何洛洛', '碳烤卡莫纳尘头', '盐焗九衰', '孜然墨瑶曦', '泡零距离', '腌 Roguelike 高手', '大尾巴狼刺身', '炸酱薛定谔', '面筋雪舞烟', '酸辣梦玲', '高压一团空气', '小火慢炖向阳织梦', '奶油蛋糕萤火虫', '游戏君炖粉条', '红烧100811', '玉石KFC', '油炸终焉', '蜜汁墨瑶曦', '糖醋锦衣卫jdl' ]; var STORE_KEY = 'baocaiming.v4'; var LEGACY_KEYS = ['baocaiming.v3', 'baocaiming.v2', 'baocaiming.v1']; var ROLL_MS = 1500; var el = { dish: document.getElementById('dish'), sub: document.getElementById('sub'), pick: document.getElementById('pick'), album: document.getElementById('album'), bars: document.getElementById('bars'), collect: document.getElementById('collect'), total: document.getElementById('total'), reset: document.getElementById('reset'), toggle: document.getElementById('toggle'), toggleText: document.getElementById('toggle-text'), fold: document.getElementById('fold'), toggleStats: document.getElementById('toggle-stats'), toggleStatsText: document.getElementById('toggle-stats-text'), foldStats: document.getElementById('fold-stats'), peek: document.getElementById('peek') }; var state = { counts: {}, total: 0, collapsed: true, statsCollapsed: true }; var rolling = false; var lastIdx = -1; var previewAll = false; function loadState() { try { var legacy = false; var raw = localStorage.getItem(STORE_KEY); if (!raw) { for (var i = 0; i < LEGACY_KEYS.length && !raw; i++) { raw = localStorage.getItem(LEGACY_KEYS[i]); if (raw) legacy = true; } } if (!raw) return; var data = JSON.parse(raw); if (!data || typeof data !== 'object') return; if (data.counts && typeof data.counts === 'object') state.counts = data.counts; state.total = Number(data.total) || 0; if (!legacy) { if (typeof data.collapsed === 'boolean') state.collapsed = data.collapsed; if (typeof data.statsCollapsed === 'boolean') state.statsCollapsed = data.statsCollapsed; } } catch (err) { } } function saveState() { try { localStorage.s function settle(shown) { var idx = Math.random() < 0.5 ? shown : pickIndex(); if (idx === lastIdx) idx = pickIndex(); var name = DISHES[idx]; var isNew = countOf(name) === 0; state.counts[name] = countOf(name) + 1; state.total += 1; saveState(); lastIdx = idx; el.dish.textContent = name; el.dish.classList.remove('rolling', 'hit'); void el.dish.offsetWidth; el.dish.classList.add('hit'); var jade=isJadeDish(name);el.dish.classList.toggle('gold',jade);el.sub.textContent=jade?(isNew?'玉石显灵！新菜入鉴！':'玉石显灵！'):(isNew?'新菜入鉴！':'就它了');var _r=el.dish.getBoundingClientRect();fxBurst(_r.left+_r.width/2,_r.top+_r.height/2,jade);if(jade)fxFlash(); renderAll(isNew ? idx : -1); el.pick.disabled = false; rolling = false; } el.pick.addEventListener('click', roll); function bindToggle(name) { var cfg = PANELS[name]; el[cfg.btn].addEventListener('click', function () { setCollapse(name, !state[cfg.key], true); saveState(); }); } bindToggle('album'); bindToggle('stats'); el.peek.addEventListener('click', function () { previewAll = !previewAll; el.peek.textContent = previewAll ? '恢复图鉴' : '全部点亮'; if (previewAll && state.collapsed) setCollapse('album', false, true); renderAlbum(-1); }); el.reset.addEventListener('click', function () { if (!window.confirm('确定清空所有抽取记录和图鉴吗？')) return; state.counts = {}; state.total = 0; saveState(); el.dish.textContent = '？'; el.sub.textContent = '今晚吃谁，交给随机'; renderAll(); }); window.addEventListener('keydown', function (e) { if (e.code !== 'Space' && e.key !== ' ') return; var tag = e.target && e.target.tagName; if (tag === 'BUTTON' || tag === 'INPUT' || tag === 'TEXTAREA') return; e.preventDefault(); if (!rolling) roll(); }); (function(){var P='清蒸|红烧|油炸|醋溜|爆炒|烧烤|油煎|糖醋|香辣|麻辣|水煮|凉拌|蒜蓉|风干|酸辣|煸炒|小炒|酱爆|葱爆|干炸|酥炸|复炸|闷|炖|煨|烩|粉蒸|扣蒸|卤|拔丝|蜜汁|椒麻|椒盐|五香|孜然|黑椒|咖喱|酸汤|泡椒|烟熏|酒香|剁椒|避风塘|茄汁'.split("|");var b=document.getElementById("bgfx");if(!b)return;var t=P.map(function(x){return "—"+x+"—"}).join("");for(var i=0;i<16;i++){var d=document.createElement("div");d.className="bg-row"+(i <script>
/* 每页都能弹两下：按 1–7 是七根空弦 */
(function(){
  var OPEN=[130.81,146.83,174.61,196.00,220.00,261.63,293.66];
  var NAME=["C3","D3","F3","G3","A3","C4","D4"];
  var CN=["一","二","三","四","五","六","七"];
  var ac=null,box=null,tid=null;

  function ac_(){ if(!ac){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; ac=new C(); } return ac; }

  function pluck(f){
    var a=ac_(); if(!a) return;
    if(a.state==="suspended") a.resume();
    var sr=a.sampleRate, N=Math.max(2,Math.round(sr/f));
    var dur=1.7, buf=a.createBuffer(1,Math.round(sr*dur),sr), d=buf.getChannelData(0);
    var line=new Float32Array(N), i;
    for(i=0;i<N;i++) line[i]=Math.random()*2-1;
    var p=0;
    for(i=0;i<d.length;i++){
      var cur=line[p], nxt=line[(p+1)%N];
      d[i]=cur;
      line[p]=(cur+nxt)*0.5*0.9974;
      p=(p+1)%N;
    }
    /* 末尾淡出，防爆音 */
    var tail=Math.round(sr*0.06);
    for(i=d.length-tail;i<d.length;i++) d[i]*=(d.length-i)/tail;

    var src=a.createBufferSource(); src.buffer=buf;
    var lp=a.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2800;
    var g=a.createGain(); g.gain.value=0.30;
    src.connect(lp); lp.connect(g); g.connect(a.destination);
    src.start();
  }

  function tip(t){
    if(!box){
      box=document.createElement("div");
      box.style.cssText="position:fixed;right:18px;bottom:18px;z-index:99;"
        +"font:11px ui-monospace,Consolas,monospace;letter-spacing:.12em;color:#8ff5ec;"
        +"background:rgba(5,12,14,.88);border:1px solid rgba(0,201,194,.30);"
        +"border-radius:2px;padding:6px 12px;opacity:0;transition:opacity .18s;pointer-events:none";
      document.body.appendChild(box);
    }
    box.textContent=t;
    box.style.opacity="1";
    clearTimeout(tid);
    tid=setTimeout(function(){ box.style.opacity="0"; }, 900);
  }

  document.addEventListener("keydown", function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var tag=(e.target&&e.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea"||tag==="select") return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=7){
      e.preventDefault();
      pluck(OPEN[n-1]);
      tip("♪ "+CN[n-1]+"弦 "+NAME[n-1]);
    }
  });
})();
</script>
