<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>乘票 · 防风 Zephyr</title>
<meta name="description" content="从川泽出发，目的地你写。">
<style>
:root{
  --bg:#050c0e;
  --main:#009E9D;
  --hi:#8ff5ec;
  --ink:#e9f6f5;
  --dim:#6f8f92;
  --line:rgba(0,201,194,.18);
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
  --sans:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(120% 90% at 50% -10%, rgba(0,158,157,.13), transparent 60%),
    radial-gradient(80% 60% at 50% 110%, rgba(0,158,157,.07), transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:90;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
  opacity:.3;mix-blend-mode:multiply;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:89;
  background:radial-gradient(120% 100% at 50% 50%, transparent 58%, rgba(0,0,0,.5));
}

.wrap{
  position:relative;
  max-width:1040px;margin:0 auto;
  padding:clamp(20px,4vw,44px) clamp(14px,4vw,28px) 70px;
}

/* 顶栏 */
.bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--dim);
  padding-bottom:10px;margin-bottom:clamp(18px,3vw,30px);
  border-bottom:1px solid var(--line);
}
.bar a{color:var(--dim);text-decoration:none}
.bar a:hover{color:var(--hi)}
.bar b{color:var(--hi);font-weight:500}
.bar .ro{color:var(--main);border:1px solid rgba(0,201,194,.35);border-radius:2px;padding:2px 7px;font-size:10px;letter-spacing:.14em}

/* 标题 */
.head{margin-bottom:22px}
.head h1{font-size:clamp(19px,3.4vw,25px);font-weight:600;letter-spacing:.05em}
.head p{
  margin-top:8px;font-size:13px;color:var(--dim);line-height:1.8;
}
.head p code{
  font-family:var(--mono);font-size:12px;color:var(--main);
  background:rgba(0,158,157,.08);padding:1px 5px;border-radius:2px;
}

/* 票 */
.stage{
  position:relative;z-index:95;
  border:1px solid var(--line);
  background:rgba(0,158,157,.02);
  padding:clamp(8px,1.6vw,16px);
  border-radius:3px;
}
.stage::before{
  content:"PREVIEW · 1990 × 820";position:absolute;top:-1px;right:-1px;
  font-family:var(--mono);font-size:9px;letter-spacing:.2em;
  color:#052a2b;background:var(--main);
  padding:2px 9px;border-radius:0 3px 0 3px;z-index:3;
}
.hidden{display:none !important}
#back, #ticket{
  display:block;width:100%;height:auto;
  border-radius:2px;
  box-shadow:0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.4);
}

/* 控件 */
/* 手机上票太宽，给横向滑动 */
@media (max-width:760px){
  .stage{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding-bottom:30px}
  #ticket{width:760px;max-width:none}
  .stage::after{
    content:"← 左右滑动看全票 →";
    position:absolute;left:50%;transform:translateX(-50%);
    bottom:9px;font-family:var(--mono);font-size:9px;letter-spacing:.18em;
    color:rgba(0,201,194,.6);pointer-events:none;white-space:nowrap;
  }
}

.presets{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.presets:empty{display:none}
.presets button{
  font:inherit;font-size:11px;letter-spacing:.04em;
  padding:3px 8px;border-radius:999px;cursor:pointer;
  background:transparent;color:var(--dim);
  border:1px solid rgba(0,201,194,.22);
  transition:color .18s,border-color .18s,background .18s;
}
.presets button:hover{
  color:var(--hi);border-color:rgba(0,201,194,.5);
  background:rgba(0,201,194,.06);
}

/* C：按票面 1088 : 490 分双栏 */
.ctrls{
  display:grid;
  grid-template-columns:minmax(0,1088fr) minmax(0,490fr);
  gap:clamp(26px,3.4vw,48px);
  margin-top:clamp(24px,3.4vw,36px);
}
.ctrls .group{margin-top:0}
@media (max-width:980px){
  .ctrls{grid-template-columns:1fr;gap:clamp(24px,3vw,34px)}
}

/* 分组 */
.group{margin-top:clamp(22px,3.2vw,34px)}
.gh{
  display:flex;align-items:baseline;gap:10px;
  padding-bottom:9px;margin-bottom:16px;
  border-bottom:1px solid rgba(0,201,194,.13);
}
.gh span{font-size:12px;letter-spacing:.16em;color:var(--ink)}
.gh i{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;
  color:var(--dim);font-style:normal;
}
.ctrl{display:grid;gap:16px 20px;align-items:start}
.ctrl.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ctrl.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.ctrl .f.wide{grid-column:1 / -1}
.ctrl .f.wide select{font-size:13px;letter-spacing:.01em}
@media (max-width:880px){ .ctrl.g3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .ctrl.g3,.ctrl.g2{grid-template-columns:1fr} }

/* B：预设挂在 label 里，不额外占高度 */
.f label{display:flex;align-items:baseline;gap:8px}
.quick{margin-left:7px;display:flex;gap:6px}
.quick button{
  font:inherit;font-family:var(--sans);font-size:9.5px;letter-spacing:.05em;
  background:none;border:none;padding:0;cursor:pointer;
  color:rgba(0,201,194,.42);transition:color .18s;
}
.quick button:hover{color:var(--hi)}
.quick button::before{content:"·";margin-right:5px;color:rgba(0,201,194,.22)}
.quick button:first-child::before{display:none}
.f{display:flex;flex-direction:column;gap:6px}
.f label{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--main);
}
.f input,.f select{
  font-family:var(--sans);font-size:14.5px;color:var(--ink);
  background:transparent;border:none;
  border-bottom:1px solid rgba(255,255,255,.13);
  border-radius:0;padding:6px 0 9px;
  outline:none;transition:border-color .2s, color .2s;
  width:100%;
}
.f input:focus,.f select:focus{
  border-bottom-color:var(--main);
}
.f input:hover,.f select:hover{border-bottom-color:rgba(255,255,255,.26)}
.f input[type=date]{position:relative;padding-right:22px;color-scheme:dark}
.f input[type=date]::-webkit-calendar-picker-indicator{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  opacity:.5;cursor:pointer;padding:0;margin:0;
}
.f input[type=date]::-webkit-calendar-picker-indicator:hover{opacity:.85}
.f input::placeholder{color:#4e6668}
.f select{color-scheme:dark;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 7px) 58%,calc(100% - 2px) 58%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.f select option{
  background:#0b1a1c;color:#e9f6f5;
  font-family:var(--sans);font-size:14px;padding:8px;
}
.f select option:checked{background:#123c3c;color:#8ff5ec}

.check{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12px;color:var(--dim2);cursor:pointer;user-select:none;
  padding:8px 12px;border-radius:8px;
  transition:color .18s,background .18s;
}
.check:hover{color:#cfe7e4;background:rgba(0,201,194,.05)}
.check input{
  appearance:none;width:14px;height:14px;flex:0 0 auto;
  border:1px solid rgba(0,201,194,.45);border-radius:3px;
  background:transparent;cursor:pointer;position:relative;
  transition:background .16s,border-color .16s;
}
.check input:checked{background:var(--main);border-color:var(--main)}
.check input:checked::after{
  content:"";position:absolute;left:4px;top:1px;
  width:4px;height:8px;border:solid #04120f;
  border-width:0 1.8px 1.8px 0;transform:rotate(42deg);
}
.shelf{margin-top:clamp(22px,3vw,34px)}
.shelf-h{
  display:flex;align-items:baseline;gap:10px;
  padding-bottom:9px;margin-bottom:14px;
  border-bottom:1px solid rgba(0,201,194,.13);
}
.shelf-h span{font-size:12.5px;letter-spacing:.14em;color:var(--main)}
.shelf-h i{
  font-style:normal;font-family:var(--mono);font-size:9px;
  letter-spacing:.22em;color:var(--dim3);
}
.shelf-h em{
  margin-left:auto;font-style:normal;font-family:var(--mono);
  font-size:10px;letter-spacing:.1em;color:var(--dim3);
}
.shelf-grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}
@media (max-width:640px){ .shelf-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }

.card{
  position:relative;padding:14px 14px 12px;
  border:1px dashed rgba(0,201,194,.20);border-radius:10px;
  background:transparent;cursor:pointer;text-align:left;
  transition:border-color .2s,background .2s;
  font:inherit;color:inherit;
}
.card:hover{border-color:rgba(0,201,194,.45);background:rgba(0,201,194,.04)}
.card b{
  display:block;font-size:15px;font-weight:600;
  color:rgba(233,246,245,.58);letter-spacing:.04em;
  transition:color .2s;
}
.card span{
  display:block;margin-top:6px;font-family:var(--mono);font-size:9px;
  letter-spacing:.16em;color:var(--dim3);
}
.card em{
  position:absolute;right:11px;top:12px;font-style:normal;
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  color:rgba(0,201,194,.42);
}
.card.on{
  border-style:solid;border-color:rgba(0,201,194,.42);
  background:rgba(0,201,194,.055);
}
.card.on b{color:var(--hi2)}
.card.on em{color:var(--main)}
.card.on::after{
  content:"";position:absolute;left:14px;bottom:9px;
  width:22px;height:2px;background:rgba(0,201,194,.55);
}

.actions{
  margin-top:clamp(24px,3.4vw,34px);
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;
}
.minor{display:flex;align-items:center;gap:8px;font-style:normal}
.minor span{color:rgba(255,255,255,.18);font-size:12px}
.minor button{
  font:inherit;font-size:12.5px;letter-spacing:.06em;
  background:none;border:none;padding:2px 0;cursor:pointer;
  color:var(--dim);
  border-bottom:1px solid transparent;
  transition:color .18s,border-color .18s;
}
.minor button:hover{color:var(--hi);border-bottom-color:rgba(0,201,194,.5)}
.btn{
  font-family:var(--sans);font-size:14px;letter-spacing:.05em;
  padding:11px 22px;border-radius:2px;cursor:pointer;
  border:1px solid rgba(0,201,194,.42);
  background:rgba(0,158,157,.1);color:var(--hi);
  transition:background .18s,border-color .18s,transform .1s;
}
.btn:hover{background:rgba(0,158,157,.2);border-color:var(--hi)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--main);color:#04292a;border-color:var(--main);font-weight:600}
.btn.primary:hover{background:#00b4b3;border-color:#00b4b3}

.tip{
  margin-top:22px;font-family:var(--mono);font-size:10.5px;line-height:2;
  color:#4f6a6c;letter-spacing:.05em;
}

.foot{
  margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10.5px;line-height:2;color:#4f6a6c;
}
</style>
<meta name="theme-color" content="#050c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="旅行驿站">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>@media (hover:none){html{-webkit-tap-highlight-color:transparent}*{-webkit-touch-callout:none}input,textarea,select{-webkit-touch-callout:default;user-select:text;-webkit-user-select:text}}</style>
</head>
<body>

<div class="wrap">
  <div class="bar">
    <span><b>TER-M</b> &nbsp;/&nbsp; <a href="../index.html">⟵ 终端</a> &nbsp;/&nbsp; 车票</span>
    <span class="ro">只读镜像</span>
  </div>

  <div class="head">
    <h1>乘票</h1>
    <p>出发地默认 <code>川泽</code>（可以改）。目的地留空，你自己填——填什么都行，反正这趟车不解释。</p>
  </div>

  <div class="stage">
    <canvas id="back" width="1990" height="820" class="hidden"></canvas>
  <canvas id="ticket" width="1990" height="820"></canvas>
  </div>

  <div class="ctrls">
    <div class="group">
      <div class="gh"><span>出票信息</span><i>ISSUE</i></div>
      <div class="ctrl g3">
        <div class="f">
          <label>出发地</label>
          <input id="from" type="text" maxlength="10" value="川泽" autocomplete="off">
        </div>
        <div class="f">
          <label>
            <span>目的地</span>
            <span class="quick" id="presets">
              <button type="button" data-to="神舟">神舟</button>
              <button type="button" data-to="蚀">蚀</button>
              <button type="button" data-to="洄">洄</button>
              <button type="button" data-to="溯黎">溯黎</button>
            </span>
          </label>
          <input id="to" type="text" maxlength="14" placeholder="你写" autocomplete="off">
        </div>
        <div class="f">
          <label>持票人</label>
          <input id="who" type="text" maxlength="14" placeholder="你" autocomplete="off">
        </div>
      </div>
    </div>

    <div class="group">
      <div class="gh"><span>票据要素</span><i>PARTICULARS</i></div>
      <div class="ctrl g2">
        <div class="f">
          <label>日期</label>
          <input id="date" type="date">
        </div>
        <div class="f">
          <label>座位</label>
          <select id="seat">
            <option value="c3">c3 · 低</option>
            <option value="c4" selected>c4 · 中</option>
            <option value="c5">c5 · 高</option>
            <option value="c6">c6 · 极限</option>
          </select>
        </div>
        <div class="f">
          <label>舱位</label>
          <select id="cls">
            <option value="靠窗" selected>靠窗</option>
            <option value="过道">过道</option>
            <option value="车顶">车顶</option>
            <option value="行李架">行李架</option>
          </select>
        </div>
        <div class="f wide">
          <label>联句</label>
          <select id="couplet">
            <option value="0" selected>川泽生防风 · 清歌彻远岑</option>
            <option value="1">别回头，迎着风，往前闯吧</option>
            <option value="2">只要有人记得我存在 · 就足够了</option>
            <option value="3">挡风的人，自己也是风</option>
            <option value="4">不写</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="shelf">
    <div class="shelf-h"><span>收藏册</span><i>COLLECTION</i><em id="shelfCount">0 / 4</em></div>
    <div class="shelf-grid" id="shelf"></div>
  </div>

  <div class="actions">
    <label class="check"><input type="checkbox" id="notch" checked> 剪票口</label>
    <button type="button" class="btn" id="flip">翻面</button>
    <button class="btn primary" id="save">存成图片</button>
    <var class="minor">
      <button type="button" id="saveStub">只存票根</button>
      <span>·</span>
      <button type="button" id="reroll">换一句寄语</button>
    </var>
  </div>

  <div class="tip">
    PNG · 1990 × 820 · 双击图片也能直接存<br>
    车次编号由日期生成，同一天出同一张票
  </div>

  <div class="foot">
    防风 Zephyr · 形象来自「防风Zephyr」企划组 · 允许非商用二次分发
  </div>
</div>

<script>
(function(){
  "use strict";

  var W = 1990, H = 820;

  var QR_TEXT = "防风 Zephyr · 旅行驿站\nB站/VCPedia 搜「防风Zephyr」";
  // 每张的浓度与横向位置：图是背景，不能压字
  var ART_TUNE = {
    "溯黎": { a: 0.80, x: 0.50, c: 0 },
    "蚀":   { a: 0.26, x: 0.06, c: 0.58 },
    "洄":   { a: 0.60, x: 0.50, c: 0 },
    "神舟": { a: 0.52, x: 0.12, c: 0.52 }

  /* ---------- 工具 ---------- */
  function setFont(size, weight, fam){
    ctx.font = (weight || 400) + " " + size + "px " + (fam || F.sans);
  }
  function text(s, x, y, o){
    o = o || {};
    ctx.save();
    ctx.fillStyle = o.color || C.ink;
    ctx.textAlign = o.align || "left";
    ctx.textBaseline = o.baseline || "alphabetic";
    if (o.spacing) {
      // 手工字距
      var chars = String(s).split("");
      var total = 0, i;
      for (i = 0; i < chars.length; i++) total += ctx.measureText(chars[i]).width + o.spacing;
      total -= o.spacing;
      var cx = o.align === "center" ? x - total / 2 : (o.align === "right" ? x - total : x);
      for (i = 0; i < chars.length; i++) {
        ctx.fillText(chars[i], cx, y);
        cx += ctx.measureText(chars[i]).width + o.spacing;
      }
    } else {
      ctx.fillText(s, x, y);
    }
    ctx.restore();
  }
  function measure(s){
    return ctx.measureText(String(s)).width;
  }
  function line(x1, y1, x2, y2, color, w, dash){
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = w || 1;
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.restore();
  }
  function rrect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ---------- 确定性随机 ---------- */
  function rng(seed){
    var s = seed >>> 0;
    return function(){
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }
  function hash(str){
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++){
      h ^= str.charCodeAt(i);
      h = (h * 16777619) >>> 0;
    }
    return h >>> 0;
  }

  /* 存图：手机上优先走系统分享（可直接存相册/发微信），不支持再退回下载 */
  function savePNG(cv, name){
    function dl(){
      var a = document.createElement("a");
      a.href = cv.toDataURL("image/png");
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
    if (!(navigator.canShare && cv.toBlob)){ dl(); return; }
    cv.toBlob(function (b) {
      try {
        var f = new File([b], name, { type: "image/png" });
        if (navigator.canShare({ files: [f] })){
          navigator.share({ files: [f] }).catch(dl);
          return;
        }
      } catch (e) {}
      dl();
    }, "image/png");
  }

    return { full: m[1] + "." + m[2] + "." + m[3], short: m[2] + m[3], y: +m[1], md: m[2] + "." + m[3] };
  }

      c.setLineDash([9, 8]);

  function draw(){

    var to     = toRaw || "你写";

    var d      = fmtDate(elDate.value);
    var seat   = elSeat.value;
    var note   = NOTES[noteIdx];

    var tid4 = ("0000" + (hash(d.full + "|zephyr") % 65536).toString(16).toUpperCase()).slice(-4);
    var TID  = "TER-M-" + tid4;
    var train = "c3Y-" + d.short;

    ctx.clearRect(0, 0, W, H);

    /* ---- 纸面：站台底图 + 半透明纸 ---- */
    ctx.save();
    rrect(0, 0, W, H, 18); ctx.clip();

    if (artReady){
      var iw = artImg.width, ih = artImg.height;
      var sc = Math.max(W / iw, H / ih);
      var dw = iw * sc, dh = ih * sc;
      // 偏左一点，留住站台上的人
      ctx.drawImage(artImg, (W - dw) * 0.52, (H - dh) / 2, dw, dh);
    }

    // 纸色蒙层：均匀压到刚好能读出字
    ctx.fillStyle = "rgba(245,241,232,.875)";
    ctx.fillRect(0, 0, W, H);

    // 边缘提亮 + 压暗
    var vg = ctx.createLinearGradient(0, 0, 0, H);
    vg.addColorStop(0, "rgba(255,255,255,.5)");
    vg.addColorStop(.55, "rgba(255,255,255,0)");
    vg.addColorStop(1, "rgba(120,110,90,.16)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    /* ---- 纸纹噪点（确定性）---- */
    var r0 = rng(hash(d.full + seat + to));
    ctx.save();
    for (var i = 0; i < 2600; i++){
      var nx = r0() * W, ny = r0() * H;
      ctx.fillStyle = "rgba(18,49,53," + (0.012 + r0() * 0.03).toFixed(3) + ")";
      ctx.fillRect(nx, ny, 1.2, 1.2);

    ctx.restore();


  
    /* ---- 分界线 ---- */
    var SPLIT = 1330;
    line(SPLIT, 54, SPLIT, H - 54, C.rule, 2, [10, 9]);

    [54, H - 54].forEach(function(hy){
      ctx.save();
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath(); ctx.arc(SPLIT, hy, 16, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.strokeStyle = "rgba(18,49,53,.16)"; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(SPLIT, hy, 16.6, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    });

    /* ---- 顶部青条 ---- */
    ctx.save();
    ctx.fillStyle = C.accent;
    rrect(56, 46, 210, 6, 3); ctx.fill();
    ctx.restore();

    /* ================= 左：主票面 ================= */

    text("TRAVEL POST  /  BOARDING PASS", L, 128, { color: C.mute, spacing: 1.6 });

    // 编号

    text(TID, 1180, 100, { color: C.mute, align: "right", spacing: 1.2 });
    text("NO. " + d.short + "-" + seat.toUpperCase(), 1180, 122, { color: C.mute, align: "right", spacing: 1.2 });

    line(L, 150, 1180, 150, C.rule, 1);

    // 出发 / 到达

    (function(){

    setFont(23, 400, F.serif);
    text("「" + note + "」", L, 640, { color: C.ink2 });

    /* ---- 条码：真的 Code128 B，扫得出票号 ---- */
    var bcX = L, bcY = 688, bcW = 424, bcH = 48;
    var bcText = TID.replace(/-/g, "") + "-" + d.short + "-" + seat.toUpperCase();
    var bw = c128widths(bcText);
    var totalMod = 0;
    for (var bi = 0; bi < bw.length; bi++) totalMod += bw[bi];
    var modW = bcW / totalMod;
    ctx.save();
    ctx.fillStyle = "rgba(18,49,53,.88)";
    var curX = bcX, isBar = true;
    for (var bi2 = 0; bi2 < bw.length; bi2++){
      var wpx = bw[bi2] * modW;
      if (isBar) ctx.fillRect(curX, bcY, wpx, bcH);
      curX += wpx;
      isBar = !isBar;
    }
    ctx.restore();
    setFont(10, 400, F.mono);
    text(TID + " · " + train + " · " + seat.toUpperCase(), bcX, bcY + bcH + 18, { color: C.mute, spacing: 1.4 });

    try {
      var qr = QR.matrix(QR_TEXT, "M");
      var qs = 132;                      // 二维码边长
      var qx = 690, qy = 636;
      var cell = qs / (qr.size + 8);     // 含 4 格静区
      ctx.save();
      ctx.fillStyle = "rgba(245,241,232,.92)";
      ctx.fillRect(qx - 6, qy - 6, qs + 12, qs + 12);
      ctx.fillStyle = "rgba(18,49,53,.90)";
      for (var rr = 0; rr < qr.size; rr++)
        for (var cc = 0; cc < qr.size; cc++)
          if (qr.grid[rr][cc])
            ctx.fillRect(qx + (cc + 4) * cell, qy + (rr + 4) * cell,
                         Math.ceil(cell), Math.ceil(cell));
      ctx.restore();
      setFont(9, 400, F.mono);
      text("扫这里", qx + qs / 2 - 18, qy + qs + 20, { color: C.mute, spacing: 1.2 });

    (function(){

    }[to];

    ctx.save();

    text("沿虚线撕开", 0, 0, { color: "rgba(139,156,152,.85)", align: "center", spacing: 3 });
    ctx.restore();

    /* ---- 日期刻印 ---- */
    (function(){
      var cx = 1600, cy = 680, r = 52;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-0.065);
      ctx.strokeStyle = "rgba(18,49,53,.30)";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([3, 5]);
      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(18,49,53,.20)";
      ctx.beginPath(); ctx.arc(0, 0, r - 9, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "rgba(18,49,53,.52)";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "600 21px " + F.mono;
      ctx.fillText(d.short, 0, -6);
      ctx.font = "500 8px " + F.mono;
      ctx.fillText("ISSUED", 0, 14);
      ctx.restore();
    })();

    /* ---- 剪票口（可选） ---- */
    if (elNotch && elNotch.checked){
      var ny = H * 0.5, nr = 30;
      ctx.save();
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(0, ny, nr, -Math.PI / 2, Math.PI / 2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // 剪口内缘的阴影，让缺口有厚度
      ctx.save();
      ctx.strokeStyle = "rgba(18,49,53,.13)";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(0, ny, nr, -Math.PI / 2, Math.PI / 2);
      ctx.stroke();
      ctx.restore();

      // 剪痕：两道斜虚线
      ctx.save();
      ctx.strokeStyle = "rgba(18,49,53,.22)";
      ctx.lineWidth = 1.3;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(nr, ny - nr); ctx.lineTo(nr + 62, ny - 86);
      ctx.moveTo(nr, ny + nr); ctx.lineTo(nr + 62, ny + 86);
      ctx.stroke();
      ctx.restore();
    }
  }

  var showingBack = false;

  var NOTICE = [
    ["一", "本券仅限一次，单程，不记名。"],
    ["二", "沿途风景比终点好看，建议靠窗。"],
    ["三", "到站不设报站，看到风请下车。"],

  // 四张背面画（没加载好就退回 canvas 版 CITY_ART）
  var picCache = {};
  Object.keys(ART_PIC).forEach(function(k){
    var im = new Image();
    im.onload = function(){
      picCache[k] = im;
      var cur = (elTo.value || "").trim();
      if (showingBack && cur === k) drawBack();
    };
    im.src = ART_PIC[k];
  });

  function drawBack(){
    var d = fmtDate(elDate.value);
    var seat = elSeat.value.toUpperCase();
    var tid4 = hash(d.full + "|zephyr") % 65536;
    var TID = "TER-M-" + tid4;

    ctxB.clearRect(0, 0, W, H);
    ctxB.save();
    rrectB(0, 0, W, H, 18);
    ctxB.clip();

    // 纸底
    var pg = ctxB.createLinearGradient(0, 0, 0, H);
    pg.addColorStop(0, "#f6f2e9");
    pg.addColorStop(1, "#eae5d8");
    ctxB.fillStyle = pg;
    ctxB.fillRect(0, 0, W, H);

    // 噪点
    var rb = rng(hash("back" + d.full));
    for (var i = 0; i < 2400; i++){
      ctxB.fillStyle = "rgba(18,49,53," + (0.010 + rb() * 0.024).toFixed(3) + ")";
      ctxB.fillRect(rb() * W, rb() * H, 1.2, 1.2);
    }

    // 目的地专属底纹（只在背面）
    var toB = (elTo.value || "").trim();
    var pic = picCache[toB];
    if (pic && pic.naturalWidth){
      // 白底画：multiply 让白色变透明，只留线条与色块
      var tn = ART_TUNE[toB] || { a: 0.6, x: 0.5, c: 0 };
      var scB = Math.max(W / pic.naturalWidth, H / pic.naturalHeight) * 1.30;
      var bw = pic.naturalWidth * scB, bh = pic.naturalHeight * scB;
      var dx = (W - bw) * tn.x, dy = (H - bh) / 2;

      if (tn.c > 0){
        // 只占右半边：分 26 条竖带，越往右越实，左边界自然淡入
        var NN = 60, FADE = 0.24;
        for (var i = 0; i < NN; i++){
          var f0 = i / NN, f1 = (i + 1) / NN;
          var e = (Math.min(1, f0 / FADE) + Math.min(1, f1 / FADE)) / 2;
          if (e <= 0.002) continue;
          var xa = W * (tn.c + (1 - tn.c) * f0);
          var xb = W * (tn.c + (1 - tn.c) * f1);
          ctxB.save();
          ctxB.beginPath();
          ctxB.rect(xa, 0, xb - xa + 0.5, H);
          ctxB.clip();
          ctxB.globalCompositeOperation = "multiply";
          ctxB.globalAlpha = tn.a * e;
          ctxB.drawImage(pic, dx, dy, bw, bh);
          ctxB.restore();
        }
      } else {
        ctxB.save();
        ctxB.globalCompositeOperation = "multiply";
        ctxB.globalAlpha = tn.a;
        ctxB.drawImage(pic, dx, dy, bw, bh);
        ctxB.restore();
      }
    } else {
      var artB = CITY_ART[toB];
      if (artB){ try { artB(d, ctxB); } catch(e){ console.warn("back art", e); } }
    }

    // 双线框
    ctxB.strokeStyle = "rgba(18,49,53,.16)";
    ctxB.lineWidth = 1;
    ctxB.strokeRect(56, 56, W - 112, H - 112);
    ctxB.strokeStyle = "rgba(18,49,53,.09)";
    ctxB.strokeRect(70, 70, W - 140, H - 140);

    // logo
    if (logoReady){
      var lw = 560, lh = lw * LOGO.height / LOGO.width;
      ctxB.save();
      ctxB.globalAlpha = 0.92;
      ctxB.drawImage(LOGO, 110, 108, lw, lh);
      ctxB.restore();
    }

    // 抬头小字
    ctxB.fillStyle = "rgba(18,49,53,.42)";
    ctxB.font = "500 11px " + F.mono;
    ctxB.textAlign = "left";
    ctxB.fillText("REVERSE  /  背面", 110, 330);

    ctxB.strokeStyle = "rgba(18,49,53,.16)";
    ctxB.lineWidth = 1;
    ctxB.beginPath(); ctxB.moveTo(110, 352); ctxB.lineTo(900, 352); ctxB.stroke();

    // 乘车须知
    ctxB.fillStyle = "rgba(18,49,53,.52)";
    ctxB.font = "500 10.5px " + F.mono;
    ctxB.fillText("乘车须知  CONDITIONS OF CARRIAGE", 110, 392);

    NOTICE.forEach(function(item, i){
      var y = 442 + i * 56;
      ctxB.fillStyle = "rgba(0,158,157,.72)";
      ctxB.font = "500 13px " + F.mono;
      ctxB.fillText(item[0], 110, y);
      ctxB.fillStyle = "rgba(18,49,53,.74)";
      ctxB.font = "400 19px " + F.sans;
      ctxB.fillText(item[1], 142, y);
    });

    // 右：竖排一句
    (function(){
      var txt = "挡风的人，自己也是风。";
      ctxB.fillStyle = "rgba(18,49,53,.50)";
      ctxB.font = "400 26px " + F.serif;
      ctxB.textAlign = "center";
      for (var i = 0; i < txt.length; i++){
        ctxB.fillText(txt[i], 1720, 200 + i * 36);
      }
      ctxB.font = "500 9px " + F.mono;
      ctxB.fillStyle = "rgba(18,49,53,.32)";
      ctxB.fillText("Z E P H Y R", 1720, 200 + txt.length * 36 + 26);
    })();

    // 画面名称与出处
    if (toB && (picCache[toB] || CITY_ART[toB])){
      var artLabel = { "溯黎": "黎明", "蚀": "日食", "洄": "回旋", "神舟": "轨道" }[toB] || "";
      ctxB.textAlign = "left";
      ctxB.fillStyle = "rgba(18,49,53,.40)";
      ctxB.font = "500 11px " + F.mono;
      ctxB.fillText("图  " + toB + (artLabel ? " · " + artLabel : ""), 110, 700);
      ctxB.fillStyle = "rgba(18,49,53,.26)";
      ctxB.font = "400 10px " + F.mono;
      ctxB.fillText("路途愉快 · 2026.11.24 · 防风 Zephyr 企划组", 264, 700);
    }

    // 底部条 + 编号
    ctxB.strokeStyle = "rgba(18,49,53,.14)";
    ctxB.beginPath(); ctxB.moveTo(110, 726); ctxB.lineTo(W - 110, 726); ctxB.stroke();

    ctxB.textAlign = "left";
    ctxB.fillStyle = "rgba(18,49,53,.46)";
    ctxB.font = "500 12px " + F.mono;
    ctxB.fillText(TID + "   ·   " + d.full + "   ·   " + seat, 110, 758);

    ctxB.textAlign = "right";
    ctxB.fillStyle = "rgba(18,49,53,.30)";
    ctxB.font = "500 10px " + F.mono;
    ctxB.fillText("此面朝下，交给检票的人", W - 110, 758);

    ctxB.restore();

    // 剪票口（和正面一致）
    if (elNotch && elNotch.checked){
      var ny = H * 0.5, nr = 30;
      ctxB.save();
      ctxB.globalCompositeOperation = "destination-out";
      ctxB.beginPath();
      ctxB.arc(0, ny, nr, -Math.PI / 2, Math.PI / 2);
      ctxB.closePath();
      ctxB.fill();
      ctxB.restore();

      ctxB.save();
      ctxB.strokeStyle = "rgba(18,49,53,.13)";
      ctxB.lineWidth = 1.6;
      ctxB.beginPath();
      ctxB.arc(0, ny, nr, -Math.PI / 2, Math.PI / 2);
      ctxB.stroke();
      ctxB.restore();

      ctxB.save();
      ctxB.strokeStyle = "rgba(18,49,53,.22)";
      ctxB.lineWidth = 1.3;
      ctxB.setLineDash([4, 6]);
      ctxB.beginPath();
      ctxB.moveTo(nr, ny - nr); ctxB.lineTo(nr + 62, ny - 86);
      ctxB.moveTo(nr, ny + nr); ctxB.lineTo(nr + 62, ny + 86);
      ctxB.stroke();
      ctxB.restore();
    }
  }

  function rrectB(x, y, w, h, r){
    ctxB.beginPath();
    ctxB.moveTo(x + r, y);
    ctxB.arcTo(x + w, y, x + w, y + h, r);
    ctxB.arcTo(x + w, y + h, x, y + h, r);
    ctxB.arcTo(x, y + h, x, y, r);
    ctxB.arcTo(x, y, x + w, y, r);
    ctxB.closePath();
  }

  /* ================= 交互 ================= */
  elTo.addEventListener("input", draw);
  elFrom.addEventListener("input", draw);
  elCls.addEventListener("change", draw);
  elCpl.addEventListener("change", draw);
  var elNotch = document.getElementById("notch");
  if (elNotch) elNotch.addEventListener("change", draw);

  var flipBtn = document.getElementById("flip");
  if (flipBtn){
    flipBtn.addEventListener("click", function(){
      showingBack = !showingBack;
      if (showingBack) drawBack();
      cv.classList.toggle("hidden", showingBack);
      cvBack.classList.toggle("hidden", !showingBack);
      flipBtn.textContent = showingBack ? "翻回正面" : "翻面";
    });
  }

  /* ---- 收藏册 ---- */
  var CITIES = [
    ["溯黎", "SULI"], ["蚀", "SHI"], ["洄", "HUI"], ["神舟", "SHENZHOU"]
  ];
  var FAV_KEY = "zephyr.ticket.fav";
  var favs = {};
  try { favs = JSON.parse(localStorage.getItem(FAV_KEY) || "{}") || {}; } catch(e){ favs = {}; }

  var shelf = document.getElementById("shelf");
  var shelfCount = document.getElementById("shelfCount");

  function renderShelf(){
    if (!shelf) return;
    shelf.innerHTML = "";
    var got = 0;
    CITIES.forEach(function(c){
      var name = c[0], code = c[1];
      var on = Boolean(favs[name]);
      if (on) got++;
      var b = document.createElement("button");
      b.type = "button";
      b.className = "card" + (on ? " on" : "");
      b.innerHTML =
        "<b>" + name + "</b>" +
        "<span>" + code + "</span>" +
        "<em>" + (on ? "已收 · 再点看背面" : "点击出票") + "</em>";
      b.addEventListener("click", function(){
        var wasOn = Boolean(favs[name]);
        elTo.value = name;
        favs[name] = 1;
        try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch(e){}
        elFrom.value = (elFrom.value.trim() || "川泽");
        draw();
        renderShelf();
        // 没收藏过：收下，看正面；已收藏：翻到另一面（正面↔背面来回切，永远有反馈）
        var flip = document.getElementById("flip");
        if (wasOn) flip.click();
      });
      shelf.appendChild(b);
    });
    if (shelfCount) shelfCount.textContent = got + " / 4";
  }

  var presets = document.getElementById("presets");
  if (presets){
    presets.addEventListener("click", function(e){
      var b = e.target.closest("button");
      if (!b) return;
      elTo.value = b.getAttribute("data-to") || "";
      elTo.focus();
      draw();
    });
  }
  elWho.addEventListener("input", draw);
  elDate.addEventListener("change", draw);
  elSeat.addEventListener("change", draw);

  document.getElementById("reroll").addEventListener("click", function(){
    var n = noteIdx;
    while (n === noteIdx && NOTES.length > 1) n = Math.floor(Math.random() * NOTES.length);
    noteIdx = n;
    draw();
  });

  document.getElementById("save").addEventListener("click", function(){
    var facing = showingBack ? cvBack : cv;
    var d = fmtDate(elDate.value);
    var fc = (elFrom.value.trim() || "川泽").slice(0, 10);
    savePNG(facing, (showingBack ? "乘票背面-" : "乘票-") + fc + "-" + d.full.replace(/\./g, "") + "-" + elSeat.value + ".png");
  });

  document.getElementById("saveStub").addEventListener("click", function(){
    draw();
    var d = fmtDate(elDate.value);
    var sx = 1360, sw = 1990 - sx;
    var c2 = document.createElement("canvas");
    c2.width = sw; c2.height = cv.height;
    c2.getContext("2d").drawImage(cv, sx, 0, sw, cv.height, 0, 0, sw, cv.height);
    var fc = (elFrom.value.trim() || "川泽").slice(0, 10);
    savePNG(c2, "票根-" + fc + "-" + d.full.replace(/\./g, "") + "-" + elSeat.value + ".png");
    document.body.removeChild(a);
  });

  // 双击图片也能存
  cvBack.addEventListener("dblclick", function(){ document.getElementById("save").click(); });
  cv.addEventListener("dblclick", function(){
    document.getElementById("save").click();
  });

  // 初始寄语：按日期取一条，同一天同一句
  noteIdx = hash(todayStr) % NOTES.length;
  draw();

  // 字体就绪后重画一次（避免首帧用回退字体）
  if (document.fonts && document.fonts.ready){
    renderShelf();
  document.fonts.ready.then(draw);
  }
})();
</script>
<script>try{localStorage.setItem('zephyr.visit.ticket','1')}catch(e){}</script>
<script>
/* 每页都能弹两下：按 1–7 是七根空弦 */
(function(){
  var OPEN=[130.81,146.83,174.61,196.00,220.00,261.63,293.66];
  var NAME=["C3","D3","F3","G3","A3","C4","D4"];
  var CN=["一","二","三","四","五","六","七"];
  var ac=null,box=null,tid=null;

  function ac_(){ if(!ac){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; ac=new C(); } return ac; }

  function pluck(f){
    var a=ac_(); if(!a) return;
    if(a.state==="suspended") a.resume();
    var sr=a.sampleRate, N=Math.max(2,Math.round(sr/f));
    var dur=1.7, buf=a.createBuffer(1,Math.round(sr*dur),sr), d=buf.getChannelData(0);
    var line=new Float32Array(N), i;
    for(i=0;i<N;i++) line[i]=Math.random()*2-1;
    var p=0;
    for(i=0;i<d.length;i++){
      var cur=line[p], nxt=line[(p+1)%N];
      d[i]=cur;
      line[p]=(cur+nxt)*0.5*0.9974;
      p=(p+1)%N;
    }
    /* 末尾淡出，防爆音 */
    var tail=Math.round(sr*0.06);
    for(i=d.length-tail;i<d.length;i++) d[i]*=(d.length-i)/tail;

    var src=a.createBufferSource(); src.buffer=buf;
    var lp=a.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2800;
    var g=a.createGain(); g.gain.value=0.30;
    src.connect(lp); lp.connect(g); g.connect(a.destination);
    src.start();
  }

  function tip(t){
    if(!box){
      box=document.createElement("div");
      box.style.cssText="position:fixed;right:18px;bottom:18px;z-index:99;"
        +"font:11px ui-monospace,Consolas,monospace;letter-spacing:.12em;color:#8ff5ec;"
        +"background:rgba(5,12,14,.88);border:1px solid rgba(0,201,194,.30);"
        +"border-radius:2px;padding:6px 12px;opacity:0;transition:opacity .18s;pointer-events:none";
      document.body.appendChild(box);
    }
    box.textContent=t;
    box.style.opacity="1";
    clearTimeout(tid);
    tid=setTimeout(function(){ box.style.opacity="0"; }, 900);
  }

  document.addEventListener("keydown", function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var tag=(e.target&&e.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea"||tag==="select") return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=7){
      e.preventDefault();
      pluck(OPEN[n-1]);
      tip("♪ "+CN[n-1]+"弦 "+NAME[n-1]);
    }
  });
})();
</script>
